[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nwe-world-compiler"
version = "0.1.0"
description = "Deterministic geospatial preprocessing foundation for Norge World Engine"
requires-python = ">=3.12"
dependencies = [
  "pyproj==3.7.2",
  "rasterio==1.5.0",
  "rfc8785==0.1.4",
  "shapely==2.1.2",
]

[project.scripts]
nwe-normalize-dtm = "nwe_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
