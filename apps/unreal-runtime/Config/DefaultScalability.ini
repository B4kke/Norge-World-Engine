; NWE's PC quality ceiling. Epic (3) is the playable default; Cinematic is an
; explicit capture/enthusiast preset. Neither setting changes geographic data.

[ViewDistanceQuality@3]
r.ViewDistanceScale=1.5
r.StaticMeshLODDistanceScale=0.75
r.SkeletalMeshLODBias=0

[ViewDistanceQuality@Cine]
r.ViewDistanceScale=2.0
r.StaticMeshLODDistanceScale=0.5
r.SkeletalMeshLODBias=0

[ShadowQuality@3]
r.ShadowQuality=5
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
r.Shadow.Virtual.ResolutionLodBiasLocal=0
r.Shadow.Virtual.MaxPhysicalPages=8192

[ShadowQuality@Cine]
r.ShadowQuality=5
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.0
r.Shadow.Virtual.ResolutionLodBiasLocal=-0.5
r.Shadow.Virtual.MaxPhysicalPages=12288

[GlobalIlluminationQuality@3]
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32
r.Lumen.Reflections.Quality=1

[GlobalIlluminationQuality@Cine]
r.Lumen.ScreenProbeGather.DownsampleFactor=8
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32
r.Lumen.Reflections.Quality=2

[ReflectionQuality@3]
r.ReflectionEnvironment=1
r.Lumen.Reflections.Quality=1

[ReflectionQuality@Cine]
r.ReflectionEnvironment=1
r.Lumen.Reflections.Quality=2

[PostProcessQuality@3]
r.BloomQuality=5
r.DepthOfFieldQuality=2
r.EyeAdaptationQuality=2
r.MotionBlurQuality=0
r.Tonemapper.Quality=5

[PostProcessQuality@Cine]
r.BloomQuality=5
r.DepthOfFieldQuality=4
r.EyeAdaptationQuality=2
r.MotionBlurQuality=0
r.Tonemapper.Quality=5

[TextureQuality@3]
r.Streaming.MipBias=0
r.MaxAnisotropy=8

[TextureQuality@Cine]
r.Streaming.MipBias=0
r.MaxAnisotropy=16

[EffectsQuality@3]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.TranslucencyLightingVolumeDim=64

[EffectsQuality@Cine]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=4
r.TranslucencyLightingVolumeDim=128

[FoliageQuality@3]
foliage.DensityScale=1.0
foliage.LODDistanceScale=1.5
grass.DensityScale=1.0

[FoliageQuality@Cine]
foliage.DensityScale=1.0
foliage.LODDistanceScale=2.0
grass.DensityScale=1.0
