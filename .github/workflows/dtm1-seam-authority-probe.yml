name: dtm1-seam-authority-probe

on:
  workflow_dispatch:

jobs:
  probe-provider-mosaic-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install compiler dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Capture live NHM ImageServer metadata/catalog evidence
        run: |
          mkdir -p /tmp/nwe-nhm-authority
          python tools/geo/dtm1_nhm_mosaic_authority_probe.py \
            --output /tmp/nwe-nhm-authority/authority-probe.json

      - name: Require the current evidence to remain fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/nwe-nhm-authority/authority-probe.json')
          proof = json.loads(path.read_text(encoding='utf-8'))
          assessment = proof['assessment']
          assert assessment['authority_status'] == 'FAIL_CLOSED_UNPROVEN'
          assert assessment['production_transform_authorized'] is False
          assert assessment['logical_atom_tile_name_link_confirmed'] is True
          assert assessment['raw_byte_identity_confirmed'] is False
          assert [item['name'] for item in assessment['catalog_items']] == ['33-125-116', '33-125-117']
          assert assessment['overlap']['height_m'] == 10.0
          assert assessment['service']['default_mosaic_method'] == 'ByAttribute'
          assert assessment['service']['mosaic_operator'] == 'First'
          assert assessment['service']['sort_field'] == 'NAME'
          assert assessment['service']['sort_field_type'] == 'esriFieldTypeString'
          assert assessment['service']['sort_field_supported_by_documented_byattribute_semantics'] is False
          print(json.dumps(assessment, indent=2, sort_keys=True))
          PY

      - name: Enforce metadata-only evidence boundary
        run: |
          if find /tmp/nwe-nhm-authority -type f \( -name '*.tif' -o -name '*.tiff' -o -name '*.las' -o -name '*.laz' \) | grep -q .; then
            echo 'raw geodata unexpectedly present in authority evidence' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nannestad-nhm-mosaic-authority-${{ github.sha }}
          path: /tmp/nwe-nhm-authority/authority-probe.json
          if-no-files-found: error
          retention-days: 7
