name: one-shot-append-lidar-worklog

on:
  push:
    branches:
      - agent/lumen-web-nannestad-1to1

permissions:
  contents: write

jobs:
  append:
    if: "github.event.head_commit.message == 'CI: append LiDAR worklog v3'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lumen-web-nannestad-1to1
          fetch-depth: 0

      - name: Append canonical worklog entry once
        env:
          NWE_WORKLOG_ENTRY_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('docs/05-worklog.md')
          marker = '## 2026-11-01 14:10 CET — LUMEN + FORGE + SENTINEL — P0-HYPERREAL-LIDAR-01'
          text = path.read_text(encoding='utf-8')
          if marker in text:
              raise SystemExit('worklog entry already present')
          entry = base64.b64decode(os.environ['NWE_WORKLOG_ENTRY_B64']).decode('utf-8')
          path.write_text(text.rstrip() + '\n\n' + entry.rstrip() + '\n', encoding='utf-8')
          PY

          git config user.name 'NWE one-shot worklog'
          git config user.email 'noreply@github.com'
          git add docs/05-worklog.md
          git commit -m 'docs: append P0-HYPERREAL-LIDAR-01 worklog [skip ci]'
          git push origin HEAD:agent/lumen-web-nannestad-1to1
