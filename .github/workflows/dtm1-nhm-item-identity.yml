name: dtm1-nhm-item-identity

on:
  pull_request:
    paths:
      - 'engine/compiler/src/nwe_compiler/nhm_item_identity.py'
      - 'engine/compiler/tests/test_nhm_item_identity.py'
      - 'tools/geo/dtm1_nhm_item_identity_probe.py'
      - '.github/workflows/dtm1-nhm-item-identity.yml'
      - 'docs/proofs/2026-08-19-dtm1-nhm-item-identity.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify-provider-item-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run fail-closed identity regressions
        run: PYTHONPATH=engine/compiler/src pytest -q engine/compiler/tests/test_nhm_item_identity.py
      - name: Query exact Høydedata NHM items without downloading raster bytes
        run: python tools/geo/dtm1_nhm_item_identity_probe.py --output evidence/nhm-item-identity.json
      - name: Reject raw geodata in evidence
        run: |
          if find evidence -type f \( -iname '*.tif' -o -iname '*.tiff' -o -iname '*.las' -o -iname '*.laz' \) | grep -q .; then
            echo 'raw geodata must not be uploaded as evidence' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dtm1-nhm-item-identity
          path: evidence/nhm-item-identity.json
          if-no-files-found: error
