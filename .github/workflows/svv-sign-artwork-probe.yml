name: svv-sign-artwork-probe

on:
  pull_request:
    paths:
      - 'tools/visual-data/probe_svv_sign_artwork.py'
      - 'tools/visual-data/test_probe_svv_sign_artwork.py'
      - 'tools/visual-data/materialize_svv_sign_artwork.py'
      - 'tools/visual-data/test_materialize_svv_sign_artwork.py'
      - '.github/workflows/svv-sign-artwork-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate probe and materializer contracts
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1
          python -m py_compile \
            tools/visual-data/probe_svv_sign_artwork.py \
            tools/visual-data/test_probe_svv_sign_artwork.py \
            tools/visual-data/materialize_svv_sign_artwork.py \
            tools/visual-data/test_materialize_svv_sign_artwork.py
          PYTHONPATH=tools/visual-data python -m pytest -q \
            tools/visual-data/test_probe_svv_sign_artwork.py \
            tools/visual-data/test_materialize_svv_sign_artwork.py

      - name: Probe official SVV vikeplikt artwork archive
        run: |
          python tools/visual-data/probe_svv_sign_artwork.py \
            --family vikeplikt \
            --output /tmp/nwe-svv-sign-artwork.json \
            --cache /tmp/nwe-svv-vikeplikt.zip
          python - <<'PY'
          import json
          value = json.load(open('/tmp/nwe-svv-sign-artwork.json', encoding='utf-8'))
          assert value['schema'] == 'nwe.svv-sign-artwork-probe/0.1'
          assert value['status'] == 'PASS'
          assert value['license_profile'] == 'NLOD-1.0'
          assert value['raw_byte_size'] > 0
          assert value['image_file_count'] > 0
          assert value['inferred_sign_code_count'] > 0
          print(json.dumps({
              'raw_sha256': value['raw_sha256'],
              'raw_byte_size': value['raw_byte_size'],
              'image_file_count': value['image_file_count'],
              'inferred_sign_code_count': value['inferred_sign_code_count'],
              'inferred_sign_codes': value['inferred_sign_codes'],
              'sample_entries': value['sample_entries'],
          }, indent=2, sort_keys=True, ensure_ascii=False))
          PY

      - name: Materialize exact Nannestad vikeplikt/priority artwork candidates
        run: |
          python tools/visual-data/materialize_svv_sign_artwork.py \
            --archive /tmp/nwe-svv-vikeplikt.zip \
            --output-dir /tmp/nwe-svv-sign-runtime \
            --codes 202,206 \
            --family vikeplikt \
            --source-url 'https://www.vegvesen.no/globalassets/fag/veg-og-gate/trafikkskilt-og-vegoppmerking/vikeplikt-jpg.zip?v=49939c'
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('/tmp/nwe-svv-sign-runtime')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema'] == 'nwe.svv-sign-artwork-runtime-manifest/0.1'
          assert manifest['status'] == 'PASS'
          assert manifest['source_archive_sha256'] == '4333750af2929d0e7e359457b837351fe8b51dc1638fe963804902dd514c1b28'
          assert manifest['requested_sign_codes'] == ['202', '206']
          assert [asset['sign_code'] for asset in manifest['assets']] == ['202', '206']
          for asset in manifest['assets']:
              raw = (root / asset['runtime_filename']).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == asset['sha256']
              assert len(raw) == asset['byte_size']
          print(json.dumps(manifest, indent=2, sort_keys=True, ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: svv-sign-artwork-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/nwe-svv-sign-artwork.json
            /tmp/nwe-svv-sign-runtime/manifest.json
            /tmp/nwe-svv-sign-runtime/202.jpg
            /tmp/nwe-svv-sign-runtime/206.jpg
          if-no-files-found: error
          retention-days: 14
