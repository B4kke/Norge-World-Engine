name: dtm1-source-grid-geometry-audit

on:
  pull_request:
    paths:
      - 'engine/compiler/src/nwe_compiler/dtm1_source_grid_audit.py'
      - 'engine/compiler/tests/test_dtm1_source_grid_audit.py'
      - '.github/workflows/dtm1-source-grid-geometry-audit.yml'
  workflow_dispatch:

jobs:
  audit-live-atom-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install compiler dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run focused source-grid tests
        run: pytest -q engine/compiler/tests/test_dtm1_source_grid_audit.py

      - name: Audit current official Atom geometry against documented 15 km route size
        run: |
          python - <<'PY'
          import hashlib
          import json
          from urllib.request import Request, urlopen

          from pyproj import Transformer
          from shapely.ops import transform as shapely_transform

          from nwe_compiler.dtm1_source_grid_audit import (
              SourceGridAuditError,
              audit_declared_route_grid,
              infer_route_extent,
          )
          from nwe_compiler.sources.dtm1_atom import (
              DTM1_SOURCE_CRS,
              category_crs,
              parse_feed,
              select_dataset_sources,
              select_service_dataset,
          )
          from nwe_compiler.terrain_acquisition import SERVICE_URL, USER_AGENT
          from nwe_compiler.tiles import square_tile_grid

          NOMINAL_ROUTE_SIZE_M = 15_000.0
          to_source = Transformer.from_crs('EPSG:4326', DTM1_SOURCE_CRS, always_xy=True)

          def get(url):
              req = Request(url, headers={
                  'User-Agent': USER_AGENT,
                  'Accept': 'application/atom+xml, application/xml;q=0.9',
              })
              with urlopen(req, timeout=60) as response:
                  if response.status != 200:
                      raise SystemExit(f'HTTP {response.status}: {url}')
                  return response.read()

          service_bytes = get(SERVICE_URL)
          service_entries = parse_feed(service_bytes)
          _, dataset_url = select_service_dataset(service_entries, 'DTM1')
          dataset_bytes = get(dataset_url)
          entries = parse_feed(dataset_bytes)

          # Preserve the accepted Nannestad topology assertion while broadening
          # the metadata-only audit to the complete EPSG:25833 route catalogue.
          nannestad_unique = {}
          for tile in square_tile_grid(radius=1):
              plan = select_dataset_sources(entries, target=tile.bounds)
              for source in plan.sources:
                  nannestad_unique[source.href] = source
          if len(nannestad_unique) != 2:
              raise SystemExit(
                  f'Nannestad 3x3 source topology changed: expected 2 sources, got {len(nannestad_unique)}'
              )

          declared_routes = {}
          rejected_routes = []
          epsg25833_entry_count = 0
          missing_extent_count = 0
          for entry in entries:
              if DTM1_SOURCE_CRS not in category_crs(entry):
                  continue
              epsg25833_entry_count += 1
              if entry.declared_extent is None:
                  missing_extent_count += 1
                  continue
              geom = shapely_transform(to_source.transform, entry.declared_extent.geometry)
              bounds = tuple(float(value) for value in geom.bounds)
              try:
                  infer_route_extent(bounds, nominal_route_size_m=NOMINAL_ROUTE_SIZE_M)
              except SourceGridAuditError as exc:
                  rejected_routes.append({
                      'entry_id': entry.id,
                      'title': entry.title,
                      'bounds_epsg25833': list(bounds),
                      'reason': str(exc),
                  })
                  continue
              route_id = entry.id or entry.title
              if route_id in declared_routes:
                  raise SystemExit(f'duplicate route identity in DTM1 Atom feed: {route_id!r}')
              declared_routes[route_id] = bounds

          grid_audit = audit_declared_route_grid(
              declared_routes,
              nominal_route_size_m=NOMINAL_ROUTE_SIZE_M,
          )

          result = {
              'schema': 'nwe.dtm1-live-source-grid-geometry-proof/0.2',
              'status': 'REGULARITY_MEASURED_NOT_AUTHORITY',
              'nominal_route_size_basis': 'Kartverket/Data.norge DTM1 API description: data split into 15 km routes',
              'nominal_route_size_m': NOMINAL_ROUTE_SIZE_M,
              'service_feed_url': SERVICE_URL,
              'service_feed_sha256': hashlib.sha256(service_bytes).hexdigest(),
              'dataset_feed_url': dataset_url,
              'dataset_feed_sha256': hashlib.sha256(dataset_bytes).hexdigest(),
              'dataset_entry_count': len(entries),
              'epsg25833_entry_count': epsg25833_entry_count,
              'missing_extent_count': missing_extent_count,
              'audited_route_count': len(declared_routes),
              'rejected_route_count': len(rejected_routes),
              'rejected_routes': rejected_routes,
              'nannestad_unique_source_count': len(nannestad_unique),
              'grid_audit': grid_audit,
              'production_seam_authority': False,
              'authority_status': 'UNPROVEN',
          }
          if result['production_seam_authority'] is not False:
              raise SystemExit('diagnostic must never promote a seam authority')
          if grid_audit['claim_calibration']['production_seam_authority'] is not False:
              raise SystemExit('grid audit must remain non-authoritative')

          print(json.dumps(result, indent=2, sort_keys=True))
          with open('/tmp/dtm1-source-grid-geometry-audit.json', 'w', encoding='utf-8') as fh:
              json.dump(result, fh, indent=2, sort_keys=True)
              fh.write('\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dtm1-source-grid-geometry-audit-${{ github.sha }}
          path: /tmp/dtm1-source-grid-geometry-audit.json
          if-no-files-found: error
          retention-days: 7
