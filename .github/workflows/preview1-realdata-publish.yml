name: preview1-realdata-publish

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/world-viewer/**'
      - 'tools/preview/**'
      - '.github/workflows/preview1-realdata-publish.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/world-viewer/**'
      - 'tools/preview/**'
      - '.github/workflows/preview1-realdata-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview1-realdata-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-gate:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: scope
        name: Decide whether real-data/browser proof is required
        shell: bash
        run: |
          set -eu
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event.action }}" == "opened" || "${{ github.event.action }}" == "reopened" ]]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # SENTINEL invariant: classify the complete PR base...HEAD diff, not only
          # HEAD^..HEAD. With cancel-in-progress enabled, a later docs-only commit
          # can otherwise cancel the only heavy proof for an earlier code commit.
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/nwe-preview1-pr-changed.txt
          cat /tmp/nwe-preview1-pr-changed.txt
          heavy="$(python tools/preview/preview1_change_gate.py \
            --event-name "${{ github.event_name }}" \
            --action "${{ github.event.action }}" \
            --changed-files /tmp/nwe-preview1-pr-changed.txt)"
          if [[ "$heavy" != "true" && "$heavy" != "false" ]]; then
            echo "invalid heavy classifier result: $heavy" >&2
            exit 1
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  compile-verify-publish:
    needs: change-gate
    if: needs.change-gate.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install World Compiler dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile and stage real Preview 1 snapshot
        run: |
          mkdir -p /tmp/nwe-preview-cache /tmp/nwe-preview
          python tools/preview/stage_preview1_snapshot.py \
            --cache-root /tmp/nwe-preview-cache \
            --output /tmp/nwe-preview \
            --commit-sha "$GITHUB_SHA" \
            | tee /tmp/nwe-preview-stage.json
          python -m json.tool /tmp/nwe-preview/manifest.json > /dev/null
          du -ah /tmp/nwe-preview | sort -h | tail -20

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install runtime and World Viewer dependencies
        run: npm install --workspace @nwe/schemas-js --workspace @nwe/world-viewer --include-workspace-root=false --no-audit --no-fund

      - name: Verify all published compiled bytes before distribution
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { verifyRuntimeBundle } from './engine/streaming/runtime_verifier.mjs';

          const root = '/tmp/nwe-preview';
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          if (manifest.schema !== 'nwe.world-preview-manifest/0.1' || manifest.status !== 'REAL_COMPILED') {
            throw new Error(`unexpected preview manifest ${manifest.schema}/${manifest.status}`);
          }
          for (const name of ['terrain', 'roads', 'buildings']) {
            const layer = manifest[name];
            const bundlePath = path.join(root, layer.bundle.replace(/^\.\//, ''));
            const artifactPath = path.join(root, layer.compiled_path.replace(/^\.\//, ''));
            const bundle = JSON.parse(fs.readFileSync(bundlePath, 'utf8'));
            const bytes = new Uint8Array(fs.readFileSync(artifactPath));
            const verification = verifyRuntimeBundle(bundle, bytes);
            if (!verification.ok || verification.decision !== 'READY_FOR_RUNTIME') {
              throw new Error(`${name}: ${verification.code}: ${verification.detail}`);
            }
            if (bundle.artifact_ref.sha256 !== layer.artifact_sha256) {
              throw new Error(`${name}: manifest/artifact SHA mismatch`);
            }
            console.log(JSON.stringify({ layer: name, sha256: layer.artifact_sha256, bytes: bytes.byteLength, verification: verification.code }));
          }
          NODE

      - name: Build deployable World Viewer
        run: npm run build --workspace @nwe/world-viewer

      - name: Real Preview 1 browser composition gate
        run: |
          node --check apps/world-viewer/run_preview1_browser_smoke.mjs
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version)
          node apps/world-viewer/run_preview1_browser_smoke.mjs \
            --runtime-root /tmp/nwe-preview \
            --dist-root apps/world-viewer/dist \
            --output /tmp/nwe-preview1-browser-proof.json \
            --timeout-ms 90000
          cat /tmp/nwe-preview1-browser-proof.json

      - uses: actions/upload-artifact@v4
        with:
          name: preview1-browser-proof-${{ github.sha }}
          path: /tmp/nwe-preview1-browser-proof.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish replaceable compiled snapshot branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          rm -rf /tmp/nwe-preview-publish
          mkdir -p /tmp/nwe-preview-publish/nannestad-preview-1
          cp -R /tmp/nwe-preview/. /tmp/nwe-preview-publish/nannestad-preview-1/
          cd /tmp/nwe-preview-publish
          git init
          git checkout --orphan preview-runtime
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > README.md <<'TXT'
          # Norge World Engine runtime preview artifacts

          This orphan branch is a replaceable transport snapshot for the public Preview 1 viewer.
          It contains only compiled, provenance-bound runtime artifacts and attribution metadata.
          Raw Kartverket/NVDB/OSM source data is never published here.

          This is not the selected long-term runtime object-store/CDN architecture.
          TXT
          git add README.md nannestad-preview-1
          git commit -m "Publish Nannestad Preview 1 runtime snapshot ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:preview-runtime
