name: polyhaven-tree-asset-inventory

on:
  pull_request:
    paths:
      - 'tools/visual-data/polyhaven_tree_candidates.json'
      - 'tools/visual-data/inventory_polyhaven_tree_assets.py'
      - 'tools/visual-data/test_inventory_polyhaven_tree_assets.py'
      - '.github/workflows/polyhaven-tree-asset-inventory.yml'
  workflow_dispatch:

jobs:
  metadata-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate inventory parser without provider network
        run: |
          python -m py_compile tools/visual-data/inventory_polyhaven_tree_assets.py
          python tools/visual-data/test_inventory_polyhaven_tree_assets.py

      - name: Inventory current Poly Haven metadata
        run: |
          python tools/visual-data/inventory_polyhaven_tree_assets.py --output /tmp/polyhaven-tree-inventory.json
          python -m json.tool /tmp/polyhaven-tree-inventory.json > /dev/null

      - name: Upload metadata-only inventory
        uses: actions/upload-artifact@v4
        with:
          name: polyhaven-tree-inventory-${{ github.sha }}
          path: /tmp/polyhaven-tree-inventory.json
          if-no-files-found: error
          retention-days: 14
