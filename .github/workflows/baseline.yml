name: baseline

on:
  push:
  pull_request:

jobs:
  contracts-and-compiler-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Validate repo-local Agent Skills
        run: python scripts/validate_agent_skills.py

      - name: Install Python verification dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Python syntax checks
        run: |
          python -m py_compile tools/geo/verify_nannestad_source_contracts.py
          python -m compileall -q engine/compiler/src engine/compiler/tests
          python -m py_compile prototypes/nannestad/compiler/dtm1_atom_adapter_v02.py
          python -m py_compile prototypes/nannestad/compiler/test_dtm1_atom_adapter_v02.py

      - name: Preview 1 proof-gate regressions
        run: |
          bash -n tools/preview/preview1_change_gate.sh
          python tools/preview/test_preview1_change_gate.py

      - name: Source contract verifier
        run: python tools/geo/verify_nannestad_source_contracts.py --output /tmp/nwe-source-proof.json

      - name: Production-direction compiler regressions
        run: pytest -q engine/compiler/tests

      - name: Migrated SMIA baseline test
        working-directory: prototypes/nannestad/compiler
        run: python test_dtm1_atom_adapter_v02.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install lightweight Node workspaces
        run: npm install --workspace @nwe/schemas-js --workspace @nwe/cesium-baseline --include-workspace-root=false

      - name: Cross-language RFC 8785 schema test
        run: npm run test:schemas

      - name: World coordinate contract regressions
        run: |
          node --check engine/world/world_contract.mjs
          node --check engine/world/test_world_contract.mjs
          node engine/world/test_world_contract.mjs
          node --check engine/world/network_state_contract.mjs
          node --check engine/world/test_network_state_contract.mjs
          node engine/world/test_network_state_contract.mjs
          node --check engine/world/physics_state_contract.mjs
          node --check engine/world/test_physics_state_contract.mjs
          node engine/world/test_physics_state_contract.mjs
          node --check engine/world/physics_frame_event_contract.mjs
          node --check engine/world/test_physics_frame_event_contract.mjs
          node engine/world/test_physics_frame_event_contract.mjs
          node --check engine/world/physics_frame_batch_contract.mjs
          node --check engine/world/test_physics_frame_batch_contract.mjs
          node engine/world/test_physics_frame_batch_contract.mjs
          node --check engine/world/physics_membership_contract.mjs
          node --check engine/world/test_physics_membership_contract.mjs
          node engine/world/test_physics_membership_contract.mjs
          node --check engine/world/static_collision_contract.mjs
          node --check engine/world/test_static_collision_contract.mjs
          node engine/world/test_static_collision_contract.mjs
          node --check prototypes/atlas-physics-local-collision/physics_local_collision_probe.mjs
          node --check prototypes/atlas-physics-local-collision/test_physics_local_collision_probe.mjs
          node prototypes/atlas-physics-local-collision/test_physics_local_collision_probe.mjs
          python -m json.tool engine/world/schemas/authoritative-world-snapshot-v0.1.schema.json > /dev/null
          python -m json.tool engine/world/schemas/network-spatial-snapshot-v0.1.schema.json > /dev/null
          python -m json.tool engine/world/schemas/simulation-spatial-snapshot-v0.1.schema.json > /dev/null
          python -m json.tool engine/world/schemas/physics-frame-maintenance-event-v0.1.schema.json > /dev/null
          python -m json.tool engine/world/schemas/physics-frame-maintenance-batch-v0.1.schema.json > /dev/null
          python -m json.tool engine/world/schemas/physics-frame-membership-event-v0.1.schema.json > /dev/null
          python -m json.tool engine/world/schemas/static-world-collision-binding-v0.1.schema.json > /dev/null

      - name: Runtime provenance reconstruction regression
        run: |
          node --check engine/streaming/runtime_verifier_core.mjs
          node --check engine/streaming/runtime_verifier.mjs
          node --check engine/streaming/runtime_verifier_web.mjs
          node --check engine/streaming/test_runtime_verifier.mjs
          node engine/streaming/test_runtime_verifier.mjs

      - name: World streaming scheduler regressions
        run: |
          node --check engine/streaming/tile_scheduler.mjs
          node --check engine/streaming/test_tile_scheduler.mjs
          node --check engine/streaming/test_tile_scheduler_retry.mjs
          node --check engine/streaming/lifecycle_observer.mjs
          node --check engine/streaming/test_lifecycle_observer.mjs
          node --check engine/streaming/streaming_trace_recorder.mjs
          node --check engine/streaming/test_streaming_trace_recorder.mjs
          node --check engine/streaming/streaming_trace_validator.mjs
          node --check engine/streaming/test_streaming_trace_validator.mjs
          node --check engine/streaming/benchmark_tile_scheduler.mjs
          node engine/streaming/test_tile_scheduler.mjs
          node engine/streaming/test_tile_scheduler_retry.mjs
          node engine/streaming/test_lifecycle_observer.mjs
          node engine/streaming/test_streaming_trace_recorder.mjs
          node engine/streaming/test_streaming_trace_validator.mjs
          node engine/streaming/benchmark_tile_scheduler.mjs | tee /tmp/nwe-streaming-scheduler-benchmark.json
          python -m json.tool /tmp/nwe-streaming-scheduler-benchmark.json > /dev/null

      - name: Terrain mesh worker regressions
        run: |
          node --check engine/streaming/terrain_mesh_buffers.mjs
          node --check engine/streaming/terrain_mesh_worker_protocol.mjs
          node --check engine/streaming/terrain_mesh_worker_client.mjs
          node --check engine/streaming/terrain_mesh_worker.mjs
          node --check engine/streaming/test_terrain_mesh_worker.mjs
          node engine/streaming/test_terrain_mesh_worker.mjs

      - name: Terrain verified-artifact streaming pipeline regressions
        run: |
          node --check engine/streaming/terrain_tile_loader.mjs
          node --check engine/streaming/terrain_load_observer.mjs
          node --check engine/streaming/test_terrain_tile_loader.mjs
          node --check engine/streaming/test_terrain_load_observer.mjs
          node engine/streaming/test_terrain_tile_loader.mjs
          node engine/streaming/test_terrain_load_observer.mjs

      - name: Viewer compiled-artifact boundary regression
        run: |
          node --check apps/world-viewer/artifact_consumer.mjs
          node --check apps/world-viewer/test_artifact_consumer.mjs
          node apps/world-viewer/test_artifact_consumer.mjs

      - name: Cesium 3D Tiles baseline build
        run: npm run build:cesium-baseline

      - name: Migrated VEKTOR syntax and baseline test
        run: |
          node --check prototypes/nannestad/runtime/vektor_runtime_gate_v03.mjs
          node --check prototypes/nannestad/runtime/test_vektor_runtime_gate_v03.mjs
          node prototypes/nannestad/runtime/test_vektor_runtime_gate_v03.mjs
