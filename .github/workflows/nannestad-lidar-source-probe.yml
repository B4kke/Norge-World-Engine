name: nannestad-lidar-source-probe

on:
  pull_request:
    paths:
      - 'tools/geo/probe_nannestad_lidar.py'
      - 'tools/geo/test_probe_nannestad_lidar.py'
      - 'tools/geo/inspect_nannestad_laz.py'
      - 'tools/geo/test_inspect_nannestad_laz.py'
      - 'tools/geo/requirements-lidar.txt'
      - '.github/workflows/nannestad-lidar-source-probe.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Syntax and deterministic source-gate regressions
        run: |
          python -m py_compile tools/geo/probe_nannestad_lidar.py tools/geo/inspect_nannestad_laz.py
          python -m unittest -v \
            tools/geo/test_probe_nannestad_lidar.py \
            tools/geo/test_inspect_nannestad_laz.py

  live-provider:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Capture raw official Høydedata metadata response and analyze exact tile
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          path = Path('tools/geo/probe_nannestad_lidar.py')
          spec = importlib.util.spec_from_file_location('nwe_lidar_probe', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          raw = module._request_json(module.metadata_url())
          Path('/tmp/nwe-nannestad-lidar-provider-raw.json').write_text(
              json.dumps(raw, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          analyzed = module.analyze_provider_payload(raw)
          Path('/tmp/nwe-nannestad-lidar-source-probe.json').write_text(
              json.dumps(analyzed, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('NWE_PROVIDER_RAW_BEGIN')
          print(json.dumps(raw, ensure_ascii=False, indent=2, sort_keys=True))
          print('NWE_PROVIDER_RAW_END')
          print(json.dumps(analyzed, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nannestad-lidar-source-probe-${{ github.sha }}
          path: |
            /tmp/nwe-nannestad-lidar-provider-raw.json
            /tmp/nwe-nannestad-lidar-source-probe.json
          if-no-files-found: error
          retention-days: 14
