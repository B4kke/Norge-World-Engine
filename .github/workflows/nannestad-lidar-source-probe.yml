name: nannestad-lidar-source-probe

on:
  pull_request:
    paths:
      - 'tools/geo/probe_nannestad_lidar.py'
      - 'tools/geo/test_probe_nannestad_lidar.py'
      - 'tools/geo/inspect_nannestad_laz.py'
      - 'tools/geo/test_inspect_nannestad_laz.py'
      - 'tools/geo/requirements-lidar.txt'
      - '.github/workflows/nannestad-lidar-source-probe.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Syntax and deterministic source-gate regressions
        run: |
          python -m py_compile tools/geo/probe_nannestad_lidar.py tools/geo/inspect_nannestad_laz.py
          python -m unittest -v \
            tools/geo/test_probe_nannestad_lidar.py \
            tools/geo/test_inspect_nannestad_laz.py

  live-provider:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Discover public Geonorge Høydedata project WFS for exact tile
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          base = 'https://wfs.geonorge.no/skwms1/wfs.hoyde-hoydedata-metadata-prosjekt'
          headers = {'User-Agent': 'NorgeWorldEngine/0.1 nannestad-lidar-source-probe'}

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=90) as response:
                  return response.read()

          cap_url = base + '?' + urllib.parse.urlencode({
              'service': 'WFS',
              'request': 'GetCapabilities',
          })
          capabilities = get(cap_url)
          Path('/tmp/nwe-hoydedata-wfs-capabilities.xml').write_bytes(capabilities)
          root = ET.fromstring(capabilities)
          names = []
          for feature_type in root.findall('.//{*}FeatureType'):
              name = feature_type.findtext('{*}Name')
              if name:
                  names.append(name)
          print('NWE_WFS_FEATURE_TYPES=' + json.dumps(names, ensure_ascii=False))
          Path('/tmp/nwe-hoydedata-wfs-feature-types.json').write_text(
              json.dumps(names, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          if not names:
              raise SystemExit('No WFS feature types found')

          results = []
          for index, name in enumerate(names):
              params = {
                  'service': 'WFS',
                  'version': '2.0.0',
                  'request': 'GetFeature',
                  'typeNames': name,
                  'count': '200',
                  'srsName': 'EPSG:25832',
                  'bbox': '611000,6677000,612000,6678000,EPSG:25832',
                  'outputFormat': 'application/json',
              }
              url = base + '?' + urllib.parse.urlencode(params)
              try:
                  raw = get(url)
                  text = raw.decode('utf-8-sig')
                  payload = json.loads(text)
                  count = len(payload.get('features', [])) if isinstance(payload, dict) else None
                  summary = {'type_name': name, 'url': url, 'feature_count': count}
                  results.append(summary)
                  Path(f'/tmp/nwe-hoydedata-wfs-{index}.json').write_text(
                      json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
                      encoding='utf-8',
                  )
                  print('NWE_WFS_RESULT=' + json.dumps(summary, ensure_ascii=False))
                  if count:
                      print('NWE_WFS_PAYLOAD_BEGIN')
                      print(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True))
                      print('NWE_WFS_PAYLOAD_END')
              except Exception as exc:
                  summary = {'type_name': name, 'url': url, 'error': repr(exc)}
                  results.append(summary)
                  print('NWE_WFS_RESULT=' + json.dumps(summary, ensure_ascii=False))

          Path('/tmp/nwe-hoydedata-wfs-results.json').write_text(
              json.dumps(results, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nannestad-hoydedata-wfs-discovery-${{ github.sha }}
          path: |
            /tmp/nwe-hoydedata-wfs-capabilities.xml
            /tmp/nwe-hoydedata-wfs-feature-types.json
            /tmp/nwe-hoydedata-wfs-results.json
            /tmp/nwe-hoydedata-wfs-*.json
          if-no-files-found: error
          retention-days: 14
