name: nannestad-lidar-source-probe

on:
  pull_request:
    paths:
      - 'tools/geo/probe_nannestad_lidar.py'
      - 'tools/geo/test_probe_nannestad_lidar.py'
      - 'tools/geo/inspect_nannestad_laz.py'
      - 'tools/geo/test_inspect_nannestad_laz.py'
      - 'tools/geo/requirements-lidar.txt'
      - '.github/workflows/nannestad-lidar-source-probe.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Syntax and deterministic source-gate regressions
        run: |
          python -m py_compile tools/geo/probe_nannestad_lidar.py tools/geo/inspect_nannestad_laz.py
          python -m unittest -v \
            tools/geo/test_probe_nannestad_lidar.py \
            tools/geo/test_inspect_nannestad_laz.py

  live-provider:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Inspect public Geonorge Høydedata project WFS GML for exact tile
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          base = 'https://wfs.geonorge.no/skwms1/wfs.hoyde-hoydedata-metadata-prosjekt'
          params = {
              'service': 'WFS',
              'version': '2.0.0',
              'request': 'GetFeature',
              'typeNames': 'metadata_prosjekt:Prosjektavgrensning',
              'count': '200',
              'srsName': 'EPSG:25832',
              'bbox': '611000,6677000,612000,6678000,EPSG:25832',
          }
          url = base + '?' + urllib.parse.urlencode(params)
          request = urllib.request.Request(
              url,
              headers={'User-Agent': 'NorgeWorldEngine/0.1 nannestad-lidar-source-probe'},
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              raw = response.read()
              content_type = response.headers.get('Content-Type')
          Path('/tmp/nwe-hoydedata-wfs-projects.gml').write_bytes(raw)
          print('NWE_WFS_CONTENT_TYPE=' + repr(content_type))
          print('NWE_WFS_BYTES=' + str(len(raw)))
          print('NWE_WFS_PREFIX_BEGIN')
          print(raw[:4000].decode('utf-8', errors='replace'))
          print('NWE_WFS_PREFIX_END')

          root = ET.fromstring(raw)
          local = lambda tag: tag.rsplit('}', 1)[-1]
          exception_nodes = [node for node in root.iter() if local(node.tag) in {'ExceptionText', 'ServiceException'}]
          if exception_nodes:
              messages = [''.join(node.itertext()).strip() for node in exception_nodes]
              raise SystemExit('WFS exception: ' + ' | '.join(messages))

          members = [node for node in root.iter() if local(node.tag) in {'member', 'featureMember'}]
          print('NWE_WFS_MEMBER_COUNT=' + str(len(members)))
          summaries = []
          for member in members:
              feature = next(iter(member), None)
              if feature is None:
                  continue
              props = {}
              for child in feature:
                  key = local(child.tag)
                  text = ' '.join(''.join(child.itertext()).split())
                  if text and key.lower() not in {'geom', 'geometry', 'område', 'omrade'}:
                      props[key] = text[:2000]
              summaries.append({'feature_tag': local(feature.tag), 'properties': props})
          Path('/tmp/nwe-hoydedata-wfs-project-summary.json').write_text(
              json.dumps(summaries, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('NWE_WFS_SUMMARY_BEGIN')
          print(json.dumps(summaries, ensure_ascii=False, indent=2, sort_keys=True))
          print('NWE_WFS_SUMMARY_END')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nannestad-hoydedata-wfs-gml-${{ github.sha }}
          path: |
            /tmp/nwe-hoydedata-wfs-projects.gml
            /tmp/nwe-hoydedata-wfs-project-summary.json
          if-no-files-found: error
          retention-days: 14
