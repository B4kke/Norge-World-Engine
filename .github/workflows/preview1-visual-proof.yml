name: preview1-visual-proof

on:
  pull_request:
    paths:
      - 'apps/world-viewer/**'
      - '.github/workflows/preview1-visual-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-preview-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install World Viewer dependencies
        run: npm install --workspace @nwe/world-viewer --workspace @nwe/schemas-js --include-workspace-root=false --no-audit --no-fund

      - name: Build exact World Viewer
        run: npm run build --workspace @nwe/world-viewer

      - name: Materialize accepted Preview 1 runtime snapshot
        run: |
          rm -rf /tmp/nwe-preview-runtime
          git clone --depth 1 --branch preview-runtime "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/nwe-preview-runtime
          test -f /tmp/nwe-preview-runtime/nannestad-preview-1/manifest.json
          python -m json.tool /tmp/nwe-preview-runtime/nannestad-preview-1/manifest.json > /dev/null

      - name: Exact accepted road-ribbon geometry gate
        shell: bash
        run: |
          set -eu
          runtime_root=/tmp/nwe-preview-runtime/nannestad-preview-1
          roads_relative="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('$runtime_root/manifest.json','utf8')); process.stdout.write(String(m.roads.compiled_path).replace(/^\.\//,''));")"
          node apps/world-viewer/inspect_real_road_surface.mjs "$runtime_root/$roads_relative"

      - name: Capture REAL WORLD READY screenshot
        shell: bash
        run: |
          set -u
          mkdir -p artifacts
          for attempt in 1 2; do
            echo "Visual proof Chrome attempt ${attempt}/2"
            rm -f artifacts/preview1-ground-ready.png
            if node apps/world-viewer/capture_preview1_screenshot.mjs \
              --runtime-root /tmp/nwe-preview-runtime/nannestad-preview-1 \
              --dist-root apps/world-viewer/dist \
              --output artifacts/preview1-ground-ready.png \
              --timeout-ms 90000; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then sleep 2; fi
          done
          echo "Visual proof failed after two bounded Chrome startup attempts" >&2
          exit 1

      - name: Upload exact visual proof
        uses: actions/upload-artifact@v4
        with:
          name: preview1-visual-proof-${{ github.sha }}
          path: artifacts/preview1-ground-ready.png
          if-no-files-found: error
          retention-days: 14
