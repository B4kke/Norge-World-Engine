name: preview1-visual-proof

on:
  pull_request:
    paths:
      - 'apps/world-viewer/**'
      - 'apps/unreal-runtime/Tools/fetch_sentinel_ground_imagery.py'
      - 'apps/unreal-runtime/Tools/prepare_ground_imagery.py'
      - 'apps/unreal-runtime/requirements-authoring.txt'
      - 'tools/preview/**'
      - 'tools/visual-data/probe_svv_sign_artwork.py'
      - 'tools/visual-data/materialize_svv_sign_artwork.py'
      - 'tools/geo/compile_nvdb_road_realism.py'
      - 'tools/geo/compile_nvdb_street_detail.py'
      - 'engine/compiler/**'
      - 'engine/streaming/runtime_verifier*.mjs'
      - 'requirements-dev.txt'
      - '.github/workflows/preview1-visual-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-preview-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install compiler and visual-authoring dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check -r apps/unreal-runtime/requirements-authoring.txt

      - name: Install World Viewer dependencies
        run: npm install --workspace @nwe/world-viewer --workspace @nwe/schemas-js --include-workspace-root=false --no-audit --no-fund

      - name: Build exact World Viewer
        run: npm run build --workspace @nwe/world-viewer

      - name: Materialize exact current Nannestad runtime snapshot
        env:
          PYTHONPATH: engine/compiler/src
          NWE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          rm -rf /tmp/nwe-visual-runtime /tmp/nwe-visual-cache
          mkdir -p /tmp/nwe-visual-runtime /tmp/nwe-visual-cache
          python tools/preview/stage_preview1_snapshot.py \
            --cache-root /tmp/nwe-visual-cache \
            --output /tmp/nwe-visual-runtime \
            --commit-sha "$NWE_SOURCE_SHA" \
            | tee /tmp/nwe-visual-stage.json
          python tools/preview/stage_nvdb_road_realism.py \
            --snapshot-root /tmp/nwe-visual-runtime \
            | tee /tmp/nwe-visual-road-realism.json
          python tools/preview/stage_nvdb_street_detail.py \
            --snapshot-root /tmp/nwe-visual-runtime \
            | tee /tmp/nwe-visual-street-detail.json
          python tools/preview/stage_svv_sign_artwork.py \
            --snapshot-root /tmp/nwe-visual-runtime \
            | tee /tmp/nwe-visual-sign-artwork.json
          python tools/preview/stage_sentinel_ground.py \
            --snapshot-root /tmp/nwe-visual-runtime \
            | tee /tmp/nwe-visual-ground.json
          python -m json.tool /tmp/nwe-visual-runtime/manifest.json

      - name: Verify staged realism descriptors before rendering
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { verifyRuntimeBundle } from './engine/streaming/runtime_verifier.mjs';

          const root = '/tmp/nwe-visual-runtime';
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          if (manifest.schema !== 'nwe.world-preview-manifest/0.1') throw new Error('visual manifest schema mismatch');
          if (manifest.tile?.id !== 'epsg25832_611000_6677000_1000m') throw new Error('visual tile mismatch');
          for (const name of ['terrain', 'roads', 'buildings']) {
            const layer = manifest[name];
            const bundle = JSON.parse(fs.readFileSync(path.join(root, layer.bundle.replace(/^\.\//, '')), 'utf8'));
            const bytes = new Uint8Array(fs.readFileSync(path.join(root, layer.compiled_path.replace(/^\.\//, ''))));
            const verification = verifyRuntimeBundle(bundle, bytes);
            if (!verification.ok || verification.decision !== 'READY_FOR_RUNTIME') throw new Error(`${name}: ${verification.code}`);
          }
          for (const name of ['building_surface', 'roof_orientation', 'vegetation', 'road_realism', 'street_detail', 'sign_artwork']) {
            const layer = manifest.realism_layers?.[name];
            if (!layer?.path || !layer?.artifact_sha256) throw new Error(`${name}: realism descriptor missing`);
            const bytes = fs.readFileSync(path.join(root, layer.path.replace(/^\.\//, '')));
            const sha = crypto.createHash('sha256').update(bytes).digest('hex');
            if (sha !== layer.artifact_sha256) throw new Error(`${name}: sha mismatch`);
          }
          const street = JSON.parse(fs.readFileSync(path.join(root, manifest.realism_layers.street_detail.path.replace(/^\.\//, '')), 'utf8'));
          if (!(street.stats?.feature_part_count > 0)) throw new Error('street detail empty');
          if (street.compiler_algorithm !== 'nvdb-v4-explicit-geometry-street-detail-v0.5') throw new Error('street detail algorithm mismatch');
          if (!(street.stats?.features_with_source_location > 0)) throw new Error('street detail source location missing');
          const signManifestPath = path.join(root, manifest.realism_layers.sign_artwork.path.replace(/^\.\//, ''));
          const signManifest = JSON.parse(fs.readFileSync(signManifestPath, 'utf8'));
          if (signManifest.schema !== 'nwe.svv-sign-artwork-runtime-manifest/0.1') throw new Error('sign artwork schema mismatch');
          if (signManifest.source_archive_sha256 !== '4333750af2929d0e7e359457b837351fe8b51dc1638fe963804902dd514c1b28') throw new Error('sign artwork source archive mismatch');
          for (const asset of signManifest.assets ?? []) {
            const bytes = fs.readFileSync(path.join(path.dirname(signManifestPath), asset.runtime_filename));
            const sha = crypto.createHash('sha256').update(bytes).digest('hex');
            if (sha !== asset.sha256 || bytes.length !== asset.byte_size) throw new Error(`sign artwork asset mismatch: ${asset.sign_code}`);
          }
          console.log(JSON.stringify({
            realism_layers: Object.keys(manifest.realism_layers).sort(),
            street_detail_parts: street.stats.feature_part_count,
            street_detail_by_type: street.stats.feature_parts_by_type_id,
            street_detail_source_location_parts: street.stats.features_with_source_location,
            sign_artwork_codes: signManifest.requested_sign_codes,
          }, null, 2));
          NODE

      - name: Capture REAL WORLD READY screenshot
        run: |
          mkdir -p artifacts
          node apps/world-viewer/capture_preview1_screenshot.mjs \
            --dist-root apps/world-viewer/dist \
            --runtime-root /tmp/nwe-visual-runtime \
            --ground-imagery-manifest ground/ground-imagery.json \
            --output artifacts/preview1-ground-ready.png \
            --timeout-ms 90000

      - name: Upload exact visual proof
        uses: actions/upload-artifact@v4
        with:
          name: preview1-visual-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/preview1-ground-ready.png
          if-no-files-found: error
          retention-days: 14
