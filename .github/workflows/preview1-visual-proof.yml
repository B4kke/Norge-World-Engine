name: preview1-visual-proof

on:
  pull_request:
    paths:
      - 'apps/world-viewer/**'
      - 'apps/unreal-runtime/Tools/nwe_unreal_pipeline.py'
      - 'apps/unreal-runtime/Tools/verify_runtime_snapshot.mjs'
      - 'engine/streaming/runtime_verifier*.mjs'
      - '.github/workflows/preview1-visual-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-preview-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install World Viewer dependencies
        run: npm install --workspace @nwe/world-viewer --workspace @nwe/schemas-js --include-workspace-root=false --no-audit --no-fund

      - name: Build exact World Viewer
        run: npm run build --workspace @nwe/world-viewer

      - name: Materialize and verify pinned runtime snapshot
        run: |
          rm -rf apps/unreal-runtime/Saved/NWE/Snapshot
          python apps/unreal-runtime/Tools/nwe_unreal_pipeline.py fetch \
            --snapshot-dir apps/unreal-runtime/Saved/NWE/Snapshot
          node apps/unreal-runtime/Tools/verify_runtime_snapshot.mjs \
            apps/unreal-runtime/Saved/NWE/Snapshot

      - name: Capture REAL WORLD READY screenshot
        run: |
          mkdir -p artifacts
          node apps/world-viewer/capture_preview1_screenshot.mjs \
            --dist-root apps/world-viewer/dist \
            --runtime-root apps/unreal-runtime/Saved/NWE/Snapshot \
            --output artifacts/preview1-ground-ready.png \
            --timeout-ms 90000

      - name: Upload exact visual proof
        uses: actions/upload-artifact@v4
        with:
          name: preview1-visual-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/preview1-ground-ready.png
          if-no-files-found: error
          retention-days: 14
