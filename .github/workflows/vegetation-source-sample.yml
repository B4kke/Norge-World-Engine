name: vegetation-source-sample

on:
  pull_request:
    paths:
      - '.github/workflows/vegetation-source-sample.yml'
      - 'engine/compiler/src/nwe_compiler/vegetation.py'
      - 'engine/compiler/tests/test_vegetation.py'
      - 'tools/visual-data/materialize_vegetation_source_cache.py'
      - 'tools/visual-data/normalize_vegetation_source_sample.py'
      - 'tools/visual-data/compile_vegetation_representative_sample.py'
      - 'tools/visual-data/verify_vegetation_representative_sample.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install compiler and GDAL dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          if ! command -v ogrinfo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gdal-bin
          fi
          ogrinfo --version
          ogrinfo --formats | grep -i SOSI
          ogrinfo --formats | grep -i GML

      - name: Syntax and compiler contract checks
        run: |
          python -m py_compile tools/visual-data/materialize_vegetation_source_cache.py
          python -m py_compile tools/visual-data/normalize_vegetation_source_sample.py
          python -m py_compile tools/visual-data/verify_vegetation_source_sample.py
          python -m py_compile tools/visual-data/compile_vegetation_representative_sample.py
          python -m py_compile tools/visual-data/verify_vegetation_representative_sample.py
          pytest -q engine/compiler/tests/test_vegetation.py

      - name: Materialize bounded provider cache
        run: |
          rm -rf /tmp/nwe-vegetation-cache /tmp/nwe-vegetation-normalize /tmp/nwe-vegetation-compiled
          mkdir -p /tmp/nwe-vegetation-normalize /tmp/nwe-vegetation-compiled
          python tools/visual-data/materialize_vegetation_source_cache.py \
            --work-dir /tmp/nwe-vegetation-cache \
            --output /tmp/nwe-vegetation-materialization.json

      - name: Normalize cached sources A1
        env:
          PROJ_NETWORK: 'OFF'
          GML_DOWNLOAD_SCHEMA: 'NO'
        run: |
          python tools/visual-data/normalize_vegetation_source_sample.py \
            --cache-root /tmp/nwe-vegetation-cache \
            --manifest /tmp/nwe-vegetation-materialization.json \
            --ar50-index 0 \
            --work-dir /tmp/nwe-vegetation-normalize/a1 \
            --output /tmp/nwe-vegetation-normalize/normalized-a1.json \
            --evidence /tmp/nwe-vegetation-normalize/evidence-a1.json

      - name: Normalize cached sources A2
        env:
          PROJ_NETWORK: 'OFF'
          GML_DOWNLOAD_SCHEMA: 'NO'
        run: |
          python tools/visual-data/normalize_vegetation_source_sample.py \
            --cache-root /tmp/nwe-vegetation-cache \
            --manifest /tmp/nwe-vegetation-materialization.json \
            --ar50-index 0 \
            --work-dir /tmp/nwe-vegetation-normalize/a2 \
            --output /tmp/nwe-vegetation-normalize/normalized-a2.json \
            --evidence /tmp/nwe-vegetation-normalize/evidence-a2.json

      - name: Normalize independent AR50 acquisition B
        env:
          PROJ_NETWORK: 'OFF'
          GML_DOWNLOAD_SCHEMA: 'NO'
        run: |
          python tools/visual-data/normalize_vegetation_source_sample.py \
            --cache-root /tmp/nwe-vegetation-cache \
            --manifest /tmp/nwe-vegetation-materialization.json \
            --ar50-index 1 \
            --work-dir /tmp/nwe-vegetation-normalize/b \
            --output /tmp/nwe-vegetation-normalize/normalized-b.json \
            --evidence /tmp/nwe-vegetation-normalize/evidence-b.json

      - name: Verify deterministic normalized candidate sample
        run: |
          python tools/visual-data/verify_vegetation_source_sample.py \
            --materialization /tmp/nwe-vegetation-materialization.json \
            --evidence-a1 /tmp/nwe-vegetation-normalize/evidence-a1.json \
            --evidence-a2 /tmp/nwe-vegetation-normalize/evidence-a2.json \
            --evidence-b /tmp/nwe-vegetation-normalize/evidence-b.json \
            --normalized-a1 /tmp/nwe-vegetation-normalize/normalized-a1.json \
            --normalized-a2 /tmp/nwe-vegetation-normalize/normalized-a2.json \
            --output /tmp/nwe-vegetation-sample-evidence.json

      - name: Compile representative artifact A1
        run: |
          python tools/visual-data/compile_vegetation_representative_sample.py \
            --input /tmp/nwe-vegetation-normalize/normalized-a1.json \
            --output /tmp/nwe-vegetation-compiled/artifact-a1.json \
            --evidence /tmp/nwe-vegetation-compiled/evidence-a1.json

      - name: Compile representative artifact A2
        run: |
          python tools/visual-data/compile_vegetation_representative_sample.py \
            --input /tmp/nwe-vegetation-normalize/normalized-a2.json \
            --output /tmp/nwe-vegetation-compiled/artifact-a2.json \
            --evidence /tmp/nwe-vegetation-compiled/evidence-a2.json

      - name: Compile representative artifact B
        run: |
          python tools/visual-data/compile_vegetation_representative_sample.py \
            --input /tmp/nwe-vegetation-normalize/normalized-b.json \
            --output /tmp/nwe-vegetation-compiled/artifact-b.json \
            --evidence /tmp/nwe-vegetation-compiled/evidence-b.json

      - name: Verify representative artifact determinism
        run: |
          python tools/visual-data/verify_vegetation_representative_sample.py \
            --artifact-a1 /tmp/nwe-vegetation-compiled/artifact-a1.json \
            --artifact-a2 /tmp/nwe-vegetation-compiled/artifact-a2.json \
            --evidence-a1 /tmp/nwe-vegetation-compiled/evidence-a1.json \
            --evidence-a2 /tmp/nwe-vegetation-compiled/evidence-a2.json \
            --evidence-b /tmp/nwe-vegetation-compiled/evidence-b.json \
            --output /tmp/nwe-vegetation-representative-verification.json

      - name: Verify accepted vegetation semantic identity
        run: |
          actual="$(sha256sum /tmp/nwe-vegetation-compiled/artifact-a1.json | awk '{print $1}')"
          verified="$(python -c 'import json; print(json.load(open("/tmp/nwe-vegetation-representative-verification.json"))["artifact_sha256"])')"
          expected_semantic="320a7e8aadc00fce2ef3912e48f64e279962c5084a89210bca853f506a2f4f1f"
          actual_semantic="$(python -c 'import json; print(json.load(open("/tmp/nwe-vegetation-representative-verification.json"))["artifact_semantic_sha256"])')"
          expected_config="f3a3206a559c00196c2a8fc9c397697aae20bef98a25e5e598766fc4de5bd90e"
          actual_config="$(python -c 'import json; print(json.load(open("/tmp/nwe-vegetation-representative-verification.json"))["compiler_config_id"])')"
          status="$(python -c 'import json; print(json.load(open("/tmp/nwe-vegetation-representative-verification.json"))["status"])')"
          same_cache="$(python -c 'import json; print(str(json.load(open("/tmp/nwe-vegetation-representative-verification.json"))["same_cache_byte_identical"]).lower())')"
          independent="$(python -c 'import json; print(str(json.load(open("/tmp/nwe-vegetation-representative-verification.json"))["independent_ar50_semantic_equal"]).lower())')"
          echo "artifact=$actual"
          echo "verification_artifact=$verified"
          echo "semantic=$actual_semantic"
          echo "compiler_config=$actual_config"
          test "$actual" = "$verified"
          test "$actual_semantic" = "$expected_semantic"
          test "$actual_config" = "$expected_config"
          test "$status" = "PASS"
          test "$same_cache" = "true"
          test "$independent" = "true"

      - name: Publish replaceable derived vegetation transport
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          rm -rf /tmp/nwe-vegetation-publish
          mkdir -p /tmp/nwe-vegetation-publish/nannestad-preview-1
          cp /tmp/nwe-vegetation-compiled/artifact-a1.json \
            /tmp/nwe-vegetation-publish/nannestad-preview-1/vegetation-representatives.json
          cp /tmp/nwe-vegetation-representative-verification.json \
            /tmp/nwe-vegetation-publish/nannestad-preview-1/vegetation-verification.json
          cd /tmp/nwe-vegetation-publish
          git init
          git checkout --orphan visual-runtime
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > README.md <<'TXT'
          # Norge World Engine derived visual runtime artifacts

          This orphan branch is a replaceable transport for compiled presentation inputs.
          It contains no raw SR16V/AR50 provider files. Consumers must verify the pinned
          artifact SHA before use. This branch is not authoritative world truth.
          TXT
          git add README.md nannestad-preview-1
          git commit -m "Publish Nannestad vegetation representative artifact"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:visual-runtime

      - uses: actions/upload-artifact@v4
        with:
          name: vegetation-source-sample-${{ github.sha }}
          path: |
            /tmp/nwe-vegetation-materialization.json
            /tmp/nwe-vegetation-sample-evidence.json
            /tmp/nwe-vegetation-normalize/evidence-a1.json
            /tmp/nwe-vegetation-normalize/evidence-b.json
            /tmp/nwe-vegetation-normalize/normalized-a1.json
            /tmp/nwe-vegetation-compiled/evidence-a1.json
            /tmp/nwe-vegetation-compiled/evidence-b.json
            /tmp/nwe-vegetation-compiled/artifact-a1.json
            /tmp/nwe-vegetation-representative-verification.json
          if-no-files-found: error
          retention-days: 14
