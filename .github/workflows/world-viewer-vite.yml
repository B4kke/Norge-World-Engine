name: world-viewer-vite

on:
  pull_request:
    paths:
      - 'apps/world-viewer/**'
      - 'engine/streaming/**'
      - 'package.json'
      - '.github/workflows/world-viewer-vite.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install viewer + shared verifier dependencies
        run: npm install --workspace @nwe/world-viewer --workspace @nwe/schemas-js --include-workspace-root=false --no-audit --no-fund

      - name: Existing viewer boundary regressions
        run: |
          node --check apps/world-viewer/artifact_consumer.mjs
          node --check apps/world-viewer/benchmark/geometry.mjs
          node --check apps/world-viewer/benchmark/params.mjs
          node --check apps/world-viewer/benchmark/benchmark.mjs
          node --check apps/world-viewer/run_benchmark.mjs
          node apps/world-viewer/test_artifact_consumer.mjs
          node apps/world-viewer/test_benchmark_geometry.mjs
          node apps/world-viewer/test_benchmark_params.mjs

      - name: Preview camera, graphics and observability regressions
        run: |
          node --check apps/world-viewer/src/previewCameraControls.mjs
          node --check apps/world-viewer/src/graphicsProfiles.mjs
          node --check apps/world-viewer/src/rendererObservability.mjs
          node --check apps/world-viewer/src/preview1SceneGeometry.mjs
          node --check apps/world-viewer/src/preview1WebGl2Renderer.mjs
          node --check apps/world-viewer/src/preview1WebGpuRenderer.mjs
          node --check apps/world-viewer/src/preview1Renderer.mjs
          node --check apps/world-viewer/run_preview1_renderer_benchmark.mjs
          node apps/world-viewer/test_preview_camera_controls.mjs
          node apps/world-viewer/test_graphics_profiles.mjs
          node apps/world-viewer/test_renderer_observability.mjs
          node apps/world-viewer/test_webgpu_upload_alignment.mjs

      - name: Terrain experiment syntax boundary
        run: |
          node --check apps/world-viewer/terrain_runtime_input.mjs
          node --check apps/world-viewer/terrain_fixture.mjs
          node --check apps/world-viewer/terrain-streaming/experiment.mjs
          node --check apps/world-viewer/terrain-streaming/benchmark.mjs
          node --check apps/world-viewer/run_terrain_streaming_benchmark.mjs

      - name: Build Vite world viewer
        run: npm run build --workspace @nwe/world-viewer

      - name: Assert static deployment output
        run: |
          test -f apps/world-viewer/dist/index.html
          test -d apps/world-viewer/dist/assets
          find apps/world-viewer/dist -maxdepth 2 -type f -print

      - name: Browser environment
        run: (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version)

      - name: Exact Preview 1 renderer A/B on accepted compiled artifacts
        run: |
          node apps/world-viewer/run_preview1_renderer_benchmark.mjs \
            --output /tmp/nwe-preview1-renderer-benchmark.json \
            --timeout-ms 90000 \
            --graphics balanced \
            --frames 90
          cat /tmp/nwe-preview1-renderer-benchmark.json

      - uses: actions/upload-artifact@v4
        with:
          name: world-viewer-renderer-benchmark-${{ github.sha }}
          path: /tmp/nwe-preview1-renderer-benchmark.json
          if-no-files-found: error
          retention-days: 7

      - name: Synthetic 1000x1000 terrain DedicatedWorker + GPU lifecycle gate
        env:
          NWE_HEADLESS_DIRECT: '1'
        run: |
          node apps/world-viewer/run_terrain_streaming_benchmark.mjs \
            --output /tmp/nwe-terrain-browser-worker.json \
            --timeout-ms 60000
          cat /tmp/nwe-terrain-browser-worker.json

      - uses: actions/upload-artifact@v4
        with:
          name: world-viewer-terrain-worker-${{ github.sha }}
          path: /tmp/nwe-terrain-browser-worker.json
          if-no-files-found: error
          retention-days: 7

      - name: Exact accepted Nannestad terrain GPU lifecycle gate
        env:
          NWE_HEADLESS_DIRECT: '1'
          EXPECTED_TERRAIN_SHA: '780de19ef1c7911bcf2476def2b91dee078612b11d10ef62923c411c6679bd96'
        run: |
          set -eu
          mkdir -p /tmp/nwe-accepted-terrain
          export SNAPSHOT_COMMIT="$(git ls-remote https://github.com/B4kke/Norge-World-Engine.git refs/heads/preview-runtime | awk '{print $1}')"
          case "$SNAPSHOT_COMMIT" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "invalid preview-runtime snapshot commit: $SNAPSHOT_COMMIT" >&2; exit 1 ;;
          esac
          BASE="https://raw.githubusercontent.com/B4kke/Norge-World-Engine/${SNAPSHOT_COMMIT}/nannestad-preview-1"
          ARTIFACT="/tmp/nwe-accepted-terrain/${EXPECTED_TERRAIN_SHA}.nwehgt"
          BUNDLE='/tmp/nwe-accepted-terrain/terrain.bundle.json'
          curl --fail --location --retry 3 --silent --show-error \
            "$BASE/terrain.bundle.json" -o "$BUNDLE"
          curl --fail --location --retry 3 --silent --show-error \
            "$BASE/compiled/epsg25832_611000_6677000_1000m/terrain-height-grid/${EXPECTED_TERRAIN_SHA}.nwehgt" -o "$ARTIFACT"
          printf '%s  %s\n' "$EXPECTED_TERRAIN_SHA" "$ARTIFACT" | sha256sum --check --strict
          node apps/world-viewer/run_terrain_streaming_benchmark.mjs \
            --artifact "$ARTIFACT" \
            --bundle "$BUNDLE" \
            --output /tmp/nwe-terrain-gpu-lifecycle-realdata.json \
            --timeout-ms 90000
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = '/tmp/nwe-terrain-gpu-lifecycle-realdata.json';
          const result = JSON.parse(fs.readFileSync(path, 'utf8'));
          const expected = process.env.EXPECTED_TERRAIN_SHA;
          const snapshotCommit = process.env.SNAPSHOT_COMMIT;
          if (result.status !== 'PASS' || result.input_mode !== 'real-input') throw new Error(`unexpected real lifecycle result: ${JSON.stringify(result)}`);
          if (result.artifact_sha256 !== expected) throw new Error(`accepted terrain SHA changed: ${result.artifact_sha256}`);
          if (result.renderer_resource_lifecycle_observed !== true) throw new Error('real terrain GPU lifecycle was not observed');
          if (result.gpu_resource_lifecycle?.physical_vram_release_observed !== false) throw new Error('physical VRAM release claim boundary missing');
          const checkpoints = Object.fromEntries((result.gpu_resource_lifecycle?.checkpoints ?? []).map((item) => [item.label, item]));
          if (checkpoints['initial-resident']?.gpu_resource_present !== true) throw new Error('initial real GPU resource missing');
          if (checkpoints['outside-active-inside-retain']?.gpu_resource_present !== false) throw new Error('real cached tile retained GPU resource');
          if (checkpoints['returned-center']?.gpu_resource_present !== true) throw new Error('real cache-hit GPU resource not recreated');
          if (result.resolver_calls !== 1 || result.scheduler?.cacheHits !== 1) throw new Error('real lifecycle refetched instead of cache-reactivating');
          result.runtime_snapshot_commit = snapshotCommit;
          fs.writeFileSync(path, `${JSON.stringify(result, null, 2)}\n`);
          console.log(JSON.stringify({
            status: result.status,
            runtime_snapshot_commit: snapshotCommit,
            artifact_sha256: result.artifact_sha256,
            renderer_resource_lifecycle_observed: result.renderer_resource_lifecycle_observed,
            physical_vram_release_observed: result.gpu_resource_lifecycle.physical_vram_release_observed,
            checkpoints: result.gpu_resource_lifecycle.checkpoints,
            activations: result.gpu_resource_lifecycle.activations,
            deactivations: result.gpu_resource_lifecycle.deactivations,
            resource_sets_created: result.gpu_resource_lifecycle.resource_sets_created,
            resource_sets_destroyed: result.gpu_resource_lifecycle.resource_sets_destroyed,
            resolver_calls: result.resolver_calls,
            cache_hits: result.scheduler.cacheHits,
          }, null, 2));
          NODE
          cat /tmp/nwe-terrain-gpu-lifecycle-realdata.json

      - uses: actions/upload-artifact@v4
        with:
          name: world-viewer-terrain-gpu-lifecycle-realdata-${{ github.sha }}
          path: /tmp/nwe-terrain-gpu-lifecycle-realdata.json
          if-no-files-found: error
          retention-days: 7
