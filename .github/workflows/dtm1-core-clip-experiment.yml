name: dtm1-core-clip-experiment

on:
  pull_request:
    paths:
      - 'engine/compiler/src/nwe_compiler/dtm1_core_clip_experiment.py'
      - 'engine/compiler/tests/test_dtm1_core_clip_experiment.py'
      - 'engine/compiler/tools/run_dtm1_core_clip_experiment.py'
      - '.github/workflows/dtm1-core-clip-experiment.yml'
  workflow_dispatch:

jobs:
  real-nannestad-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install compiler dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit regressions
        run: pytest -q engine/compiler/tests/test_dtm1_core_clip_experiment.py

      - name: Acquire exact real Nannestad overlap sources
        run: |
          mkdir -p /tmp/nwe-core-clip-data /tmp/nwe-core-clip-proof
          python - <<'PY'
          import json
          from pathlib import Path

          from nwe_compiler.dtm1_source_pool import (
              acquire_dtm1_source_objects,
              fetch_dtm1_catalog,
              plan_dtm1_tiles,
              unique_source_selections,
          )
          from nwe_compiler.tiles import prototype_tile

          cache = Path('/tmp/nwe-core-clip-data')
          proof = Path('/tmp/nwe-core-clip-proof')
          tile = prototype_tile(611000, 6676000)
          catalog = fetch_dtm1_catalog(timeout=120)
          plans = plan_dtm1_tiles(catalog, [tile])
          selections = unique_source_selections(plans)
          names = {Path(selection.href).name for selection in selections}
          expected = {'33-125-116.tif', '33-125-117.tif'}
          if names != expected:
              raise SystemExit(f'live seam source set changed: expected {sorted(expected)}, got {sorted(names)}')

          sources = acquire_dtm1_source_objects(
              cache,
              catalog,
              selections,
              refresh=True,
              timeout=900,
          )
          by_name = {
              Path(source.retrieval_identity['dataset_entry_href']).name: source
              for source in sources.values()
          }
          paths = {
              '116': by_name['33-125-116.tif'].raw_path,
              '117': by_name['33-125-117.tif'].raw_path,
          }
          (proof / 'source-paths.json').write_text(json.dumps(paths, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'diagnostic_tile_id': tile.tile_id,
              'source_names': sorted(names),
              'source_sha256': {
                  name: by_name[name].raw_sha256 for name in sorted(expected)
              },
              'source_byte_size': {
                  name: by_name[name].raw_byte_size for name in sorted(expected)
              },
          }, indent=2, sort_keys=True))
          PY

      - name: Sweep overlap and test 5px symmetric core clip
        run: |
          SOURCE_116=$(python -c "import json; print(json.load(open('/tmp/nwe-core-clip-proof/source-paths.json'))['116'])")
          SOURCE_117=$(python -c "import json; print(json.load(open('/tmp/nwe-core-clip-proof/source-paths.json'))['117'])")
          python engine/compiler/tools/run_dtm1_core_clip_experiment.py \
            --source-a "$SOURCE_116" \
            --source-b "$SOURCE_117" \
            --inset-px 5 \
            --output /tmp/nwe-core-clip-proof/core-clip-experiment.json

      - name: Validate real geometry and print decision metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          proof = Path('/tmp/nwe-core-clip-proof')
          result = json.loads((proof / 'core-clip-experiment.json').read_text(encoding='utf-8'))
          if result['source_dimensions_px']['a'] != [15010, 15010] or result['source_dimensions_px']['b'] != [15010, 15010]:
              raise SystemExit(f'unexpected real source dimensions: {result["source_dimensions_px"]}')
          if result['raw_overlap_m'] != 10:
              raise SystemExit(f'unexpected raw overlap: {result["raw_overlap_m"]}')
          if result['symmetric_inset_px'] != 5 or result['symmetric_core_side_px_if_source_is_15010'] != 15000:
              raise SystemExit('symmetric 5px -> 15000px geometry invariant failed')
          if result['candidate_count'] != 11:
              raise SystemExit(f'expected 11 integer seam candidates, got {result["candidate_count"]}')
          symmetric = result['symmetric_candidate']
          if symmetric['lower_or_left_source_trim_m'] != 5 or symmetric['upper_or_right_source_trim_m'] != 5:
              raise SystemExit(f'symmetric candidate is not 5/5: {symmetric}')

          summary = {
              'schema': 'nwe.dtm1-core-clip-overlap-summary/0.1',
              'source_dimensions_px': result['source_dimensions_px'],
              'raw_overlap_m': result['raw_overlap_m'],
              'raw_differing_fraction': result['raw_overlap']['differing_fraction'],
              'raw_absolute_delta_m': result['raw_overlap']['absolute_delta_m'],
              'symmetric_5_5': {
                  'rank_by_discontinuity_p95': symmetric['rank_by_discontinuity_p95'],
                  'cross_1m_step_abs_m': symmetric['cross_1m_step_m']['absolute'],
                  'discontinuity_after_local_slope_abs_m': symmetric['cross_discontinuity_after_local_slope_m']['absolute'],
                  'cross_abs_p95_over_local_internal_abs_p95': symmetric['cross_abs_p95_over_local_internal_abs_p95'],
              },
              'keep_one_full_edge_extremes': {
                  'lower_or_left_full': {
                      'trim_m': [
                          result['extreme_keep_lower_or_left_full_edge']['lower_or_left_source_trim_m'],
                          result['extreme_keep_lower_or_left_full_edge']['upper_or_right_source_trim_m'],
                      ],
                      'rank': result['extreme_keep_lower_or_left_full_edge']['rank_by_discontinuity_p95'],
                      'discontinuity_abs_p95_m': result['extreme_keep_lower_or_left_full_edge']['cross_discontinuity_after_local_slope_m']['absolute']['p95'],
                  },
                  'upper_or_right_full': {
                      'trim_m': [
                          result['extreme_keep_upper_or_right_full_edge']['lower_or_left_source_trim_m'],
                          result['extreme_keep_upper_or_right_full_edge']['upper_or_right_source_trim_m'],
                      ],
                      'rank': result['extreme_keep_upper_or_right_full_edge']['rank_by_discontinuity_p95'],
                      'discontinuity_abs_p95_m': result['extreme_keep_upper_or_right_full_edge']['cross_discontinuity_after_local_slope_m']['absolute']['p95'],
                  },
              },
              'symmetric_vs_best_extreme': result['symmetric_vs_best_extreme'],
              'ranking': result['ranking_by_discontinuity_p95'],
              'production_seam_authority': False,
          }
          (proof / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Remove raw terrain before evidence upload
        run: |
          rm -rf /tmp/nwe-core-clip-data
          rm -f /tmp/nwe-core-clip-proof/source-paths.json
          if find /tmp/nwe-core-clip-proof -type f \( -iname '*.tif' -o -iname '*.tiff' -o -iname '*.las' -o -iname '*.laz' \) -print -quit | grep -q .; then
            echo 'raw geodata unexpectedly remains in proof directory' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nannestad-dtm1-core-clip-experiment-${{ github.sha }}
          path: /tmp/nwe-core-clip-proof
          if-no-files-found: error
          retention-days: 7
