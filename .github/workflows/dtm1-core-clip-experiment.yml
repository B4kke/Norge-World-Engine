name: dtm1-core-clip-experiment

on:
  pull_request:
    paths:
      - 'engine/compiler/src/nwe_compiler/dtm1_core_clip_experiment.py'
      - 'engine/compiler/src/nwe_compiler/dtm1_core_clip_wcs_experiment.py'
      - 'engine/compiler/tests/test_dtm1_core_clip_experiment.py'
      - 'engine/compiler/tests/test_dtm1_core_clip_wcs_experiment.py'
      - 'engine/compiler/tools/run_dtm1_core_clip_experiment.py'
      - 'engine/compiler/tools/run_dtm1_core_clip_wcs_experiment.py'
      - '.github/workflows/dtm1-core-clip-experiment.yml'
  workflow_dispatch:

jobs:
  real-nannestad-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install compiler dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit regressions
        run: |
          pytest -q \
            engine/compiler/tests/test_dtm1_core_clip_experiment.py \
            engine/compiler/tests/test_dtm1_core_clip_wcs_experiment.py

      - name: Acquire exact real Nannestad overlap sources
        run: |
          mkdir -p /tmp/nwe-core-clip-data /tmp/nwe-core-clip-proof
          python - <<'PY'
          import json
          from pathlib import Path

          from nwe_compiler.dtm1_source_pool import (
              acquire_dtm1_source_objects,
              fetch_dtm1_catalog,
              plan_dtm1_tiles,
              unique_source_selections,
          )
          from nwe_compiler.tiles import prototype_tile

          cache = Path('/tmp/nwe-core-clip-data')
          proof = Path('/tmp/nwe-core-clip-proof')
          tile = prototype_tile(611000, 6676000)
          catalog = fetch_dtm1_catalog(timeout=120)
          plans = plan_dtm1_tiles(catalog, [tile])
          selections = unique_source_selections(plans)
          names = {Path(selection.href).name for selection in selections}
          expected = {'33-125-116.tif', '33-125-117.tif'}
          if names != expected:
              raise SystemExit(f'live seam source set changed: expected {sorted(expected)}, got {sorted(names)}')

          sources = acquire_dtm1_source_objects(
              cache,
              catalog,
              selections,
              refresh=True,
              timeout=900,
          )
          by_name = {
              Path(source.retrieval_identity['dataset_entry_href']).name: source
              for source in sources.values()
          }
          paths = {
              '116': by_name['33-125-116.tif'].raw_path,
              '117': by_name['33-125-117.tif'].raw_path,
          }
          (proof / 'source-paths.json').write_text(json.dumps(paths, indent=2) + '\n', encoding='utf-8')
          source_snapshot = {
              'schema': 'nwe.dtm1-core-clip-source-snapshot/0.1',
              'diagnostic_tile_id': tile.tile_id,
              'source_names': sorted(names),
              'source_sha256': {
                  name: by_name[name].raw_sha256 for name in sorted(expected)
              },
              'source_byte_size': {
                  name: by_name[name].raw_byte_size for name in sorted(expected)
              },
          }
          (proof / 'source-snapshot.json').write_text(
              json.dumps(source_snapshot, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(source_snapshot, indent=2, sort_keys=True))
          PY

      - name: Sweep overlap and test 5px symmetric core clip
        run: |
          SOURCE_116=$(python -c "import json; print(json.load(open('/tmp/nwe-core-clip-proof/source-paths.json'))['116'])")
          SOURCE_117=$(python -c "import json; print(json.load(open('/tmp/nwe-core-clip-proof/source-paths.json'))['117'])")
          python engine/compiler/tools/run_dtm1_core_clip_experiment.py \
            --source-a "$SOURCE_116" \
            --source-b "$SOURCE_117" \
            --inset-px 5 \
            --output /tmp/nwe-core-clip-proof/core-clip-experiment.json

      - name: Fetch provider WCS QA grid and normalize both raw candidates
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          import rasterio

          from nwe_compiler.raster import warp_dtm_to_canonical_grid

          WCS_BASE = 'https://wcs.geonorge.no/skwms1/wcs.hoyde-dtm-nhm-25832'
          EXPECTED_COVERAGE = 'nhm_dtm_topo_25832'
          BOUNDS = (611000.0, 6676000.0, 612000.0, 6677000.0)
          EXPECTED_TRANSFORM = (1.0, 0.0, 611000.0, 0.0, -1.0, 6677000.0)
          proof = Path('/tmp/nwe-core-clip-proof')
          paths = json.loads((proof / 'source-paths.json').read_text(encoding='utf-8'))

          def fetch(url, accept):
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'NorgeWorldEngine/0.1 core-clip-wcs-qa',
                  'Accept': accept,
              })
              with urllib.request.urlopen(request, timeout=120) as response:
                  if response.status != 200:
                      raise SystemExit(f'HTTP {response.status}: {url}')
                  return response.headers.get('Content-Type'), response.read()

          caps_url = WCS_BASE + '?' + urllib.parse.urlencode({
              'SERVICE': 'WCS', 'VERSION': '1.0.0', 'REQUEST': 'GetCapabilities',
          })
          caps_type, caps = fetch(caps_url, 'application/xml,text/xml;q=0.9,*/*;q=0.1')
          root = ET.fromstring(caps)
          names = []
          for element in root.iter():
              if element.tag.split('}')[-1] != 'CoverageOfferingBrief':
                  continue
              for child in list(element):
                  if child.tag.split('}')[-1] == 'name' and child.text and child.text.strip():
                      names.append(child.text.strip())
          names = sorted(set(names))
          if EXPECTED_COVERAGE not in names:
              raise SystemExit(f'missing expected terrain coverage {EXPECTED_COVERAGE!r}: {names!r}')

          describe_url = WCS_BASE + '?' + urllib.parse.urlencode({
              'SERVICE': 'WCS', 'VERSION': '1.0.0', 'REQUEST': 'DescribeCoverage', 'COVERAGE': EXPECTED_COVERAGE,
          })
          describe_type, describe = fetch(describe_url, 'application/xml,text/xml;q=0.9,*/*;q=0.1')
          coverage_url = WCS_BASE + '?' + urllib.parse.urlencode({
              'SERVICE': 'WCS',
              'VERSION': '1.0.0',
              'REQUEST': 'GetCoverage',
              'COVERAGE': EXPECTED_COVERAGE,
              'CRS': 'EPSG:25832',
              'RESPONSE_CRS': 'EPSG:25832',
              'BBOX': ','.join(str(int(value)) for value in BOUNDS),
              'WIDTH': '1000',
              'HEIGHT': '1000',
              'FORMAT': 'GeoTIFF',
          })
          coverage_type, coverage = fetch(
              coverage_url,
              'image/tiff,application/geotiff,application/octet-stream;q=0.9,*/*;q=0.1',
          )
          if coverage[:4] not in (b'II*\x00', b'MM\x00*'):
              raise SystemExit('WCS GetCoverage response is not TIFF')
          reference = Path('/tmp/nwe-core-clip-data/wcs-reference.tif')
          reference.write_bytes(coverage)

          with rasterio.open(reference) as dataset:
              meta = {
                  'crs': dataset.crs.to_string() if dataset.crs else None,
                  'bounds': list(dataset.bounds),
                  'width': dataset.width,
                  'height': dataset.height,
                  'count': dataset.count,
                  'dtype': dataset.dtypes[0],
                  'nodata': dataset.nodata,
                  'pixel_size': [abs(dataset.transform.a), abs(dataset.transform.e)],
                  'transform': list(dataset.transform)[:6],
              }
          if meta['crs'] != 'EPSG:25832' or meta['bounds'] != list(BOUNDS):
              raise SystemExit(f'WCS spatial contract mismatch: {meta}')
          if meta['width'] != 1000 or meta['height'] != 1000 or meta['count'] != 1:
              raise SystemExit(f'WCS shape mismatch: {meta}')
          if meta['pixel_size'] != [1.0, 1.0] or tuple(meta['transform']) != EXPECTED_TRANSFORM:
              raise SystemExit(f'WCS transform mismatch: {meta}')

          normalized_116 = Path('/tmp/nwe-core-clip-data/116-normalized.tif')
          normalized_117 = Path('/tmp/nwe-core-clip-data/117-normalized.tif')
          warp_dtm_to_canonical_grid(paths['116'], normalized_116, BOUNDS)
          warp_dtm_to_canonical_grid(paths['117'], normalized_117, BOUNDS)

          evidence = {
              'schema': 'nwe.dtm1-core-clip-wcs-reference/0.1',
              'role': 'independent_qa_sensor_not_promotion_source',
              'endpoint': WCS_BASE,
              'coverage': EXPECTED_COVERAGE,
              'capabilities_sha256': hashlib.sha256(caps).hexdigest(),
              'describe_coverage_sha256': hashlib.sha256(describe).hexdigest(),
              'getcoverage_sha256': hashlib.sha256(coverage).hexdigest(),
              'getcoverage_byte_size': len(coverage),
              'content_types': {
                  'capabilities': caps_type,
                  'describe_coverage': describe_type,
                  'getcoverage': coverage_type,
              },
              'raster_metadata': meta,
          }
          (proof / 'wcs-reference.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Compare all 11 seam splits to provider WCS QA
        run: |
          SOURCE_116=$(python -c "import json; print(json.load(open('/tmp/nwe-core-clip-proof/source-paths.json'))['116'])")
          SOURCE_117=$(python -c "import json; print(json.load(open('/tmp/nwe-core-clip-proof/source-paths.json'))['117'])")
          python engine/compiler/tools/run_dtm1_core_clip_wcs_experiment.py \
            --source-a "$SOURCE_116" \
            --source-b "$SOURCE_117" \
            --normalized-a /tmp/nwe-core-clip-data/116-normalized.tif \
            --normalized-b /tmp/nwe-core-clip-data/117-normalized.tif \
            --reference /tmp/nwe-core-clip-data/wcs-reference.tif \
            --inset-px 5 \
            --output /tmp/nwe-core-clip-proof/core-clip-wcs-qa.json

      - name: Validate geometry and print combined decision metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          proof = Path('/tmp/nwe-core-clip-proof')
          local = json.loads((proof / 'core-clip-experiment.json').read_text(encoding='utf-8'))
          wcs = json.loads((proof / 'core-clip-wcs-qa.json').read_text(encoding='utf-8'))
          if local['source_dimensions_px']['a'] != [15010, 15010] or local['source_dimensions_px']['b'] != [15010, 15010]:
              raise SystemExit(f'unexpected real source dimensions: {local["source_dimensions_px"]}')
          if local['raw_overlap_m'] != 10 or wcs['raw_overlap_m'] != 10:
              raise SystemExit(f'unexpected raw overlap: local={local["raw_overlap_m"]}, wcs={wcs["raw_overlap_m"]}')
          if local['symmetric_inset_px'] != 5 or local['symmetric_core_side_px_if_source_is_15010'] != 15000:
              raise SystemExit('symmetric 5px -> 15000px geometry invariant failed')
          if local['candidate_count'] != 11 or wcs['candidate_count'] != 11:
              raise SystemExit('expected exactly 11 integer seam candidates')

          local_symmetric = local['symmetric_candidate']
          wcs_symmetric = wcs['symmetric_candidate']
          if local_symmetric['lower_or_left_source_trim_m'] != 5 or local_symmetric['upper_or_right_source_trim_m'] != 5:
              raise SystemExit(f'local symmetric candidate is not 5/5: {local_symmetric}')
          if wcs_symmetric['lower_or_left_source_trim_m'] != 5 or wcs_symmetric['upper_or_right_source_trim_m'] != 5:
              raise SystemExit(f'WCS symmetric candidate is not 5/5: {wcs_symmetric}')

          summary = {
              'schema': 'nwe.dtm1-core-clip-combined-summary/0.1',
              'source_dimensions_px': local['source_dimensions_px'],
              'raw_overlap_m': local['raw_overlap_m'],
              'raw_differing_fraction': local['raw_overlap']['differing_fraction'],
              'raw_absolute_delta_m': local['raw_overlap']['absolute_delta_m'],
              'local_seam_continuity': {
                  'symmetric_5_5_rank': local_symmetric['rank_by_discontinuity_p95'],
                  'symmetric_5_5_cross_step_abs_m': local_symmetric['cross_1m_step_m']['absolute'],
                  'symmetric_5_5_discontinuity_abs_m': local_symmetric['cross_discontinuity_after_local_slope_m']['absolute'],
                  'symmetric_5_5_cross_p95_over_local_internal_p95': local_symmetric['cross_abs_p95_over_local_internal_abs_p95'],
                  'ranking': local['ranking_by_discontinuity_p95'],
              },
              'provider_wcs_qa': {
                  'role': wcs['role'],
                  'overlap_reference_pixels': wcs['target_grid']['raw_overlap_reference_pixels'],
                  'best_candidate': {
                      'trim_m': [
                          wcs['best_candidate']['lower_or_left_source_trim_m'],
                          wcs['best_candidate']['upper_or_right_source_trim_m'],
                      ],
                      'rank': wcs['best_candidate']['rank_by_reference_overlap_rmse'],
                      'symmetric': wcs['best_candidate']['symmetric'],
                      'overlap_rmse_m': wcs['best_candidate']['raw_overlap_band_only']['rmse_m'],
                      'overlap_mae_m': wcs['best_candidate']['raw_overlap_band_only']['mae_m'],
                  },
                  'symmetric_5_5': {
                      'rank': wcs_symmetric['rank_by_reference_overlap_rmse'],
                      'overlap_rmse_m': wcs_symmetric['raw_overlap_band_only']['rmse_m'],
                      'overlap_mae_m': wcs_symmetric['raw_overlap_band_only']['mae_m'],
                      'overlap_absolute_residual_m': wcs_symmetric['raw_overlap_band_only']['absolute_residual_m'],
                  },
                  'ranking': wcs['ranking_by_reference_overlap_rmse'],
              },
              'production_seam_authority': False,
              'conclusion_boundary': (
                  'local smoothness and WCS are diagnostic evidence; neither alone authorizes a production source-ownership rule'
              ),
          }
          (proof / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Remove raw terrain before evidence upload
        run: |
          rm -rf /tmp/nwe-core-clip-data
          rm -f /tmp/nwe-core-clip-proof/source-paths.json
          if find /tmp/nwe-core-clip-proof -type f \( -iname '*.tif' -o -iname '*.tiff' -o -iname '*.las' -o -iname '*.laz' \) -print -quit | grep -q .; then
            echo 'raw geodata unexpectedly remains in proof directory' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nannestad-dtm1-core-clip-experiment-${{ github.sha }}
          path: /tmp/nwe-core-clip-proof
          if-no-files-found: error
          retention-days: 7
