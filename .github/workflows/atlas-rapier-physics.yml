name: atlas-rapier-physics

on:
  pull_request:
    paths:
      - 'engine/world/**'
      - 'engine/streaming/tile_scheduler.mjs'
      - 'prototypes/atlas-rapier-physics/**'
      - '.github/workflows/atlas-rapier-physics.yml'
  workflow_dispatch:

jobs:
  rapier-rebase-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install exact Rapier WASM candidate
        working-directory: prototypes/atlas-rapier-physics
        run: npm install --package-lock=false --ignore-scripts

      - name: Syntax check ATLAS world/physics probes
        run: |
          node --check engine/world/physics_frame_event_contract.mjs
          node --check engine/world/test_physics_frame_event_contract.mjs
          node --check engine/world/physics_frame_batch_contract.mjs
          node --check engine/world/test_physics_frame_batch_contract.mjs
          node --check engine/world/physics_membership_contract.mjs
          node --check engine/world/test_physics_membership_contract.mjs
          node --check engine/world/physics_topology_contract.mjs
          node --check engine/world/test_physics_topology_contract.mjs
          node --check engine/world/static_collision_contract.mjs
          node --check engine/world/test_static_collision_contract.mjs
          node --check engine/world/static_collision_lifecycle_contract.mjs
          node --check engine/world/test_static_collision_lifecycle_contract.mjs
          node --check engine/world/static_collision_streaming_guard.mjs
          node --check engine/world/test_static_collision_streaming_guard.mjs
          node --check prototypes/atlas-rapier-physics/rapier_rebase_probe.mjs
          node --check prototypes/atlas-rapier-physics/rapier_rebase_matrix_probe.mjs
          node --check prototypes/atlas-rapier-physics/rapier_contact_replay_probe.mjs
          node --check prototypes/atlas-rapier-physics/rapier_constrained_migration_probe.mjs
          node --check prototypes/atlas-rapier-physics/rapier_static_world_migration_probe.mjs
          python -m json.tool engine/world/schemas/physics-frame-maintenance-event-v0.1.schema.json > /dev/null
          python -m json.tool engine/world/schemas/physics-frame-maintenance-batch-v0.1.schema.json > /dev/null
          python -m json.tool engine/world/schemas/physics-frame-membership-event-v0.1.schema.json > /dev/null
          python -m json.tool engine/world/schemas/physics-frame-topology-transition-v0.1.schema.json > /dev/null
          python -m json.tool engine/world/schemas/static-world-collision-binding-v0.1.schema.json > /dev/null
          python -m json.tool engine/world/schemas/static-collision-lifecycle-event-v0.1.schema.json > /dev/null

      - name: Run physics frame maintenance event regressions
        run: node engine/world/test_physics_frame_event_contract.mjs

      - name: Run multi-island physics frame batch regressions
        run: node engine/world/test_physics_frame_batch_contract.mjs

      - name: Run physics frame membership regressions
        run: node engine/world/test_physics_membership_contract.mjs

      - name: Run physics split-merge topology regressions
        run: node engine/world/test_physics_topology_contract.mjs

      - name: Run static world collision binding regressions
        run: node engine/world/test_static_collision_contract.mjs

      - name: Run streaming-aware static collision lifecycle regressions
        run: node engine/world/test_static_collision_lifecycle_contract.mjs

      - name: Run STRØM scheduler to ATLAS collision guard regressions
        run: node engine/world/test_static_collision_streaming_guard.mjs

      - name: Run fixed-vs-rebased Rapier probe
        run: |
          node prototypes/atlas-rapier-physics/rapier_rebase_probe.mjs | tee /tmp/atlas-rapier-physics.json
          python -m json.tool /tmp/atlas-rapier-physics.json > /dev/null

      - name: Run extent-frequency Rapier matrix
        run: |
          node prototypes/atlas-rapier-physics/rapier_rebase_matrix_probe.mjs | tee /tmp/atlas-rapier-matrix.json
          python -m json.tool /tmp/atlas-rapier-matrix.json > /dev/null

      - name: Run contact-rich snapshot/replay epoch probe
        run: |
          node prototypes/atlas-rapier-physics/rapier_contact_replay_probe.mjs | tee /tmp/atlas-rapier-contact-replay.json
          python -m json.tool /tmp/atlas-rapier-contact-replay.json > /dev/null

      - name: Run constrained group migration probe
        run: |
          node prototypes/atlas-rapier-physics/rapier_constrained_migration_probe.mjs | tee /tmp/atlas-rapier-constrained-migration.json
          python -m json.tool /tmp/atlas-rapier-constrained-migration.json > /dev/null

      - name: Run static world collision migration probe
        run: |
          node prototypes/atlas-rapier-physics/rapier_static_world_migration_probe.mjs | tee /tmp/atlas-rapier-static-world-migration.json
          python -m json.tool /tmp/atlas-rapier-static-world-migration.json > /dev/null

      - name: Upload ATLAS physics evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-rapier-evidence
          path: |
            /tmp/atlas-rapier-matrix.json
            /tmp/atlas-rapier-contact-replay.json
            /tmp/atlas-rapier-constrained-migration.json
            /tmp/atlas-rapier-static-world-migration.json
          retention-days: 7
