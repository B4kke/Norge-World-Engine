name: dtm1-multitile-source-plan

on:
  pull_request:
    paths:
      - 'engine/compiler/**'
      - '.github/workflows/dtm1-multitile-source-plan.yml'
  workflow_dispatch:

jobs:
  resolve-live-source-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install compiler dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Resolve official Atom source set for every 1 km runtime tile
        run: |
          python - <<'PY'
          import hashlib
          import json
          from urllib.request import Request, urlopen

          from nwe_compiler.sources.dtm1_atom import (
              parse_feed,
              retrieval_identity,
              select_dataset_sources,
              select_service_dataset,
          )
          from nwe_compiler.terrain_acquisition import SERVICE_URL, USER_AGENT
          from nwe_compiler.tiles import square_tile_grid

          def get(url):
              req = Request(url, headers={
                  'User-Agent': USER_AGENT,
                  'Accept': 'application/atom+xml, application/xml;q=0.9',
              })
              with urlopen(req, timeout=60) as response:
                  if response.status != 200:
                      raise SystemExit(f'HTTP {response.status}: {url}')
                  return response.read()

          service_bytes = get(SERVICE_URL)
          service_sha = hashlib.sha256(service_bytes).hexdigest()
          _, dataset_url = select_service_dataset(parse_feed(service_bytes), 'DTM1')
          dataset_bytes = get(dataset_url)
          dataset_sha = hashlib.sha256(dataset_bytes).hexdigest()
          entries = parse_feed(dataset_bytes)

          rows = []
          unique = {}
          for tile in square_tile_grid(radius=1):
              plan = select_dataset_sources(entries, target=tile.bounds)
              sources = []
              for source in plan.sources:
                  identity = retrieval_identity(SERVICE_URL, dataset_url, source.entry, source.extent)
                  source_row = {
                      'dataset_entry_id': source.entry.id,
                      'dataset_entry_href': source.href,
                      'dataset_entry_updated': source.entry.updated,
                      'declared_geometry_type': source.extent.geometry_type,
                      'canonical_spatial_hash': identity['spatial']['canonical_spatial_hash'],
                  }
                  sources.append(source_row)
                  unique.setdefault(source.href, set()).add(tile.tile_id)
              rows.append({
                  'tile_id': tile.tile_id,
                  'bounds_epsg25832': list(tile.bounds),
                  'target_wgs84_bounds': list(plan.target_wgs84_bounds),
                  'mosaic_required': plan.mosaic_required,
                  'source_count': len(sources),
                  'sources': sources,
              })

          result = {
              'schema': 'nwe.dtm1-multitile-source-plan-proof/0.2',
              'status': 'PASS',
              'service_feed_url': SERVICE_URL,
              'service_feed_sha256': service_sha,
              'dataset_feed_url': dataset_url,
              'dataset_feed_sha256': dataset_sha,
              'dataset_entry_count': len(entries),
              'runtime_tile_count': len(rows),
              'mosaic_runtime_tile_count': sum(1 for row in rows if row['mosaic_required']),
              'unique_source_count': len(unique),
              'sources': [
                  {'dataset_entry_href': href, 'runtime_tile_ids': sorted(tile_ids)}
                  for href, tile_ids in sorted(unique.items())
              ],
              'tiles': rows,
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          with open('/tmp/dtm1-multitile-source-plan.json', 'w', encoding='utf-8') as fh:
              json.dump(result, fh, indent=2, sort_keys=True)
              fh.write('\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dtm1-multitile-source-plan-${{ github.sha }}
          path: /tmp/dtm1-multitile-source-plan.json
          if-no-files-found: error
          retention-days: 7
