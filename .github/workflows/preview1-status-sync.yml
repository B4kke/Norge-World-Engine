name: preview1-status-sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preview1-real-nannestad
          fetch-depth: 0

      - name: Patch canonical project memory
        run: python .github/scripts/sync_preview1_status.py

      - name: Commit project-memory update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/05-worklog.md docs/06-task-queue.md docs/proofs/2026-08-18-preview1-real-world.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Project memory already current."
            exit 0
          fi
          git commit -m "Docs: accept real Nannestad Preview 1 browser proof"
          git push origin HEAD:agent/preview1-real-nannestad
