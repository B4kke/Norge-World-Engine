name: dtm1-multitile-proof

on:
  push:
    branches:
      - agent/multitile-terrain-foundation
    paths:
      - 'engine/compiler/**'
      - 'engine/streaming/**'
      - '.github/workflows/dtm1-multitile-proof.yml'
  workflow_dispatch:

jobs:
  terrain-multitile-realdata:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install compiler dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Cold live source to deterministic 3x3 terrain artifacts, then offline repeat
        run: |
          mkdir -p /tmp/nwe-multitile-data /tmp/nwe-multitile-proof/artifacts
          python - <<'PY'
          import json
          import shutil
          import time
          from pathlib import Path

          import numpy as np
          import rasterio

          from nwe_compiler.raster import warp_dtm_to_canonical_grid
          from nwe_compiler.terrain_acquisition import (
              acquire_dtm1,
              terrain_source_snapshot,
              validate_terrain_source_covers_tiles,
          )
          from nwe_compiler.terrain_artifacts import compile_terrain_artifact, persist_terrain_artifact
          from nwe_compiler.tiles import NANNESTAD_TILE, square_tile_grid

          cache = Path('/tmp/nwe-multitile-data')
          proof = Path('/tmp/nwe-multitile-proof')
          tiles = square_tile_grid(radius=1)
          if len(tiles) != 9 or tiles[4] != NANNESTAD_TILE:
              raise SystemExit('unexpected Prototype-0 3x3 tile grid')

          t0 = time.perf_counter()
          cold = acquire_dtm1(cache, refresh=True, timeout=600)
          t1 = time.perf_counter()
          cold_coverage = validate_terrain_source_covers_tiles(cold, tiles)
          t2 = time.perf_counter()

          def compile_set(acquired, label, persist):
              rows = []
              for tile in tiles:
                  tile_started = time.perf_counter()
                  normalized = proof / f'{label}-{tile.tile_id}.tif'
                  meta = warp_dtm_to_canonical_grid(acquired.raw_path, normalized, tile.bounds)
                  warped_at = time.perf_counter()
                  compiled = compile_terrain_artifact(acquired, normalized, tile=tile)
                  compiled_at = time.perf_counter()
                  persisted = persist_terrain_artifact(compiled, normalized, cache) if persist else None
                  persisted_at = time.perf_counter()

                  with rasterio.open(normalized) as dataset:
                      values = dataset.read(1)
                      valid = values[values != dataset.nodata]
                      nodata_samples = int(values.size - valid.size)
                      if valid.size != values.size:
                          raise SystemExit(f'{tile.tile_id}: canonical 1 km tile contains {nodata_samples} nodata samples')
                      elevation = {
                          'valid_samples': int(valid.size),
                          'nodata_samples': nodata_samples,
                          'min_m': float(np.min(valid)),
                          'max_m': float(np.max(valid)),
                          'mean_m': float(np.mean(valid)),
                      }

                  artifact_file = None
                  bundle_file = None
                  if persisted is not None:
                      tile_dir = proof / 'artifacts' / tile.tile_id
                      tile_dir.mkdir(parents=True, exist_ok=True)
                      artifact_copy = tile_dir / Path(persisted.artifact_path).name
                      bundle_copy = tile_dir / Path(persisted.bundle_path).name
                      shutil.copyfile(persisted.artifact_path, artifact_copy)
                      shutil.copyfile(persisted.bundle_path, bundle_copy)
                      artifact_file = str(artifact_copy.relative_to(proof))
                      bundle_file = str(bundle_copy.relative_to(proof))

                  rows.append({
                      'tile_id': tile.tile_id,
                      'bounds_epsg25832': list(tile.bounds),
                      'center_epsg25832': list(tile.center),
                      'source_sha256': acquired.raw_sha256,
                      'normalized_sha256': meta.sha256,
                      'normalized_byte_size': meta.byte_size,
                      'artifact_sha256': compiled.artifact_sha256,
                      'artifact_byte_size': len(compiled.artifact_bytes),
                      'lineage_hash': compiled.bundle['lineage_hash'],
                      'artifact_ref_hash': compiled.bundle['artifact_ref_hash'],
                      'sample_count': compiled.sample_count,
                      'elevation': elevation,
                      'artifact_file': artifact_file,
                      'bundle_file': bundle_file,
                      'timings_ms': {
                          'warp': round((warped_at - tile_started) * 1000, 3),
                          'compile': round((compiled_at - warped_at) * 1000, 3),
                          'persist': round((persisted_at - compiled_at) * 1000, 3),
                          'total': round((persisted_at - tile_started) * 1000, 3),
                      },
                  })
              return rows

          cold_tiles = compile_set(cold, 'cold', True)
          t3 = time.perf_counter()

          warm = acquire_dtm1(
              cache,
              offline=True,
              feed_fetcher=lambda *_: (_ for _ in ()).throw(AssertionError('feed network used during offline run')),
              file_fetcher=lambda *_: (_ for _ in ()).throw(AssertionError('file network used during offline run')),
          )
          t4 = time.perf_counter()
          warm_coverage = validate_terrain_source_covers_tiles(warm, tiles)
          t5 = time.perf_counter()
          warm_tiles = compile_set(warm, 'warm', False)
          t6 = time.perf_counter()

          if not warm.cache_hit:
              raise SystemExit('offline DTM1 acquisition did not use raw cache')
          if cold.raw_sha256 != warm.raw_sha256 or cold.raw_byte_size != warm.raw_byte_size:
              raise SystemExit('raw DTM1 identity changed cold->offline')
          if set(cold_coverage) != {tile.tile_id for tile in tiles}:
              raise SystemExit('cold source coverage did not validate all 9 tiles')
          if set(warm_coverage) != set(cold_coverage):
              raise SystemExit('offline source coverage set changed')

          cold_by_id = {row['tile_id']: row for row in cold_tiles}
          warm_by_id = {row['tile_id']: row for row in warm_tiles}
          if set(cold_by_id) != set(warm_by_id):
              raise SystemExit('cold/offline tile ids differ')
          for tile_id, cold_row in cold_by_id.items():
              warm_row = warm_by_id[tile_id]
              for field in ('normalized_sha256', 'artifact_sha256', 'lineage_hash', 'artifact_ref_hash'):
                  if cold_row[field] != warm_row[field]:
                      raise SystemExit(f'{tile_id}: {field} changed cold->offline')

          if len({row['artifact_sha256'] for row in cold_tiles}) != 9:
              raise SystemExit('3x3 terrain artifacts do not have 9 unique byte identities')
          if len({row['lineage_hash'] for row in cold_tiles}) != 9:
              raise SystemExit('3x3 terrain artifacts do not have 9 unique lineage identities')
          if len({row['source_sha256'] for row in cold_tiles}) != 1:
              raise SystemExit('3x3 proof unexpectedly used more than one raw source identity')

          for path in proof.glob('cold-*.tif'):
              path.unlink()
          for path in proof.glob('warm-*.tif'):
              path.unlink()

          result = {
              'schema': 'nwe.dtm1-multitile-realdata-proof/0.1',
              'status': 'PASS',
              'grid': {
                  'layout': '3x3',
                  'tile_count': 9,
                  'tile_size_m': 1000,
                  'horizontal_crs': 'EPSG:25832',
                  'vertical_datum': 'NN2000',
                  'center_tile_id': NANNESTAD_TILE.tile_id,
              },
              'source': {
                  'dataset_entry_id': cold.retrieval_identity['dataset_entry_id'],
                  'dataset_entry_href': cold.retrieval_identity['dataset_entry_href'],
                  'raw_sha256': cold.raw_sha256,
                  'raw_byte_size': cold.raw_byte_size,
                  'raster_metadata': cold.raster_metadata,
                  'source_snapshot': terrain_source_snapshot(cold),
                  'one_raw_source_for_all_tiles': True,
              },
              'tiles': cold_tiles,
              'offline_repeat': {
                  'cache_hit': warm.cache_hit,
                  'source_requests': 0,
                  'raw_identity_equal': cold.raw_sha256 == warm.raw_sha256,
                  'all_tile_hashes_equal': True,
              },
              'timings_ms': {
                  'cold_acquire': round((t1 - t0) * 1000, 3),
                  'cold_source_coverage_9_tiles': round((t2 - t1) * 1000, 3),
                  'cold_compile_persist_9_tiles': round((t3 - t2) * 1000, 3),
                  'offline_cache_verify': round((t4 - t3) * 1000, 3),
                  'offline_source_coverage_9_tiles': round((t5 - t4) * 1000, 3),
                  'offline_compile_9_tiles': round((t6 - t5) * 1000, 3),
              },
          }
          (proof / 'dtm1-multitile-proof.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'status': result['status'],
              'tile_count': result['grid']['tile_count'],
              'raw_sha256': result['source']['raw_sha256'],
              'raw_byte_size': result['source']['raw_byte_size'],
              'artifact_hashes': {row['tile_id']: row['artifact_sha256'] for row in cold_tiles},
              'timings_ms': result['timings_ms'],
              'offline_repeat': result['offline_repeat'],
          }, indent=2))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install runtime canonicalization dependency
        run: npm install --workspace @nwe/schemas-js --include-workspace-root=false

      - name: Runtime-verify all 9 exact compiled artifact byte streams
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { verifyRuntimeBundle } from './engine/streaming/runtime_verifier.mjs';

          const proofDir = '/tmp/nwe-multitile-proof';
          const report = JSON.parse(fs.readFileSync(path.join(proofDir, 'dtm1-multitile-proof.json'), 'utf8'));
          const verifications = [];
          for (const tile of report.tiles) {
            const bundle = JSON.parse(fs.readFileSync(path.join(proofDir, tile.bundle_file), 'utf8'));
            const artifact = new Uint8Array(fs.readFileSync(path.join(proofDir, tile.artifact_file)));
            const verification = verifyRuntimeBundle(bundle, artifact);
            if (!verification.ok || verification.decision !== 'READY_FOR_RUNTIME') {
              throw new Error(`${tile.tile_id}: ${verification.code}: ${verification.detail}`);
            }
            if (bundle.compile_lineage.tile_id !== tile.tile_id || bundle.artifact_ref.tile_id !== tile.tile_id) {
              throw new Error(`${tile.tile_id}: runtime bundle tile identity mismatch`);
            }
            verifications.push({ tile_id: tile.tile_id, artifact_sha256: tile.artifact_sha256, verification });
          }
          if (verifications.length !== 9) throw new Error(`expected 9 runtime verifications, got ${verifications.length}`);
          const result = {
            schema: 'nwe.dtm1-multitile-runtime-verification-proof/0.1',
            status: 'PASS',
            verified_tiles: verifications.length,
            verifications,
          };
          fs.writeFileSync(path.join(proofDir, 'runtime-verification.json'), JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify({ status: result.status, verified_tiles: result.verified_tiles }, null, 2));
          NODE

      - name: Attribution notice
        run: |
          cat > /tmp/nwe-multitile-proof/ATTRIBUTION.txt <<'EOF'
          Norge World Engine · Nannestad Prototype 0 DTM1 3x3 terrain proof

          DTM1 height data: Kartverket / Geonorge. CC BY 4.0.
          One official raw DTM1 GeoTIFF is selected through the declared Atom EPSG/GeoRSS metadata,
          then reused only after exact-byte and per-tile source-coverage validation.

          The full raw GeoTIFF is intentionally never uploaded by this workflow.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: nannestad-dtm1-3x3-proof-${{ github.sha }}
          path: /tmp/nwe-multitile-proof
          if-no-files-found: error
          retention-days: 7
