name: dtm1-multitile-proof

on:
  workflow_dispatch:

jobs:
  refactor-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual-only gate
        run: |
          echo 'The original 3x3 proof assumed one DTM1 raw source covered all runtime tiles.'
          echo 'Live source planning disproved that assumption: two southern tiles require a two-source mosaic.'
          echo 'This workflow is manual-only while source-object pooling, mosaic normalization and multi-source provenance are integrated.'
          echo 'Re-enable the full real-data proof only when it tests the two-source architecture and preserves the historical center-tile hash.'
