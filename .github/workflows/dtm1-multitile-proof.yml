name: dtm1-multitile-proof

on:
  pull_request:
    paths:
      - 'engine/compiler/**'
      - 'engine/streaming/**'
      - '.github/workflows/dtm1-multitile-proof.yml'
  workflow_dispatch:

jobs:
  terrain-multitile-realdata:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install compiler dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Cold live two-source plan, 3x3 compile, then network-free repeat
        run: |
          mkdir -p /tmp/nwe-multitile-data /tmp/nwe-multitile-proof/artifacts
          python - <<'PY'
          import json
          import shutil
          import time
          from pathlib import Path

          import numpy as np
          import rasterio

          from nwe_compiler.dtm1_source_pool import (
              acquire_dtm1_source_objects,
              fetch_dtm1_catalog,
              plan_dtm1_tiles,
              revalidate_dtm1_source_objects,
              unique_source_selections,
              validate_dtm1_source_set_covers_tile,
          )
          from nwe_compiler.terrain_artifacts import compile_terrain_artifact, persist_terrain_artifact
          from nwe_compiler.terrain_mosaic import warp_dtm_sources_to_canonical_grid
          from nwe_compiler.tiles import NANNESTAD_TILE, square_tile_grid

          HISTORICAL_CENTER_NORMALIZED_SHA = '95c8fcf6f93c8fbb0533d6a82d68416b773f9a146970e1ae85676d3ba41c2adf'
          HISTORICAL_CENTER_ARTIFACT_SHA = '780de19ef1c7911bcf2476def2b91dee078612b11d10ef62923c411c6679bd96'
          EXPECTED_SOURCE_SUFFIXES = {'33-125-116.tif', '33-125-117.tif'}
          EXPECTED_MOSAIC_TILES = {
              'epsg25832_611000_6676000_1000m',
              'epsg25832_612000_6676000_1000m',
          }

          cache = Path('/tmp/nwe-multitile-data')
          proof = Path('/tmp/nwe-multitile-proof')
          tiles = square_tile_grid(radius=1)
          if len(tiles) != 9 or tiles[4] != NANNESTAD_TILE:
              raise SystemExit('unexpected Prototype-0 3x3 tile grid')

          t0 = time.perf_counter()
          catalog = fetch_dtm1_catalog(timeout=120)
          t1 = time.perf_counter()
          plans = plan_dtm1_tiles(catalog, tiles)
          selections = unique_source_selections(plans)
          t2 = time.perf_counter()

          mosaic_tile_ids = {plan.tile.tile_id for plan in plans if plan.source_plan.mosaic_required}
          source_suffixes = {Path(source.href).name for source in selections}
          if len(catalog.entries) != 2033:
              raise SystemExit(f'live DTM1 dataset entry count changed: {len(catalog.entries)} != 2033; inspect feed before promotion')
          if len(selections) != 2 or source_suffixes != EXPECTED_SOURCE_SUFFIXES:
              raise SystemExit(f'live 3x3 source plan changed: {sorted(source_suffixes)}')
          if mosaic_tile_ids != EXPECTED_MOSAIC_TILES:
              raise SystemExit(f'live mosaic tile set changed: {sorted(mosaic_tile_ids)}')

          cold_sources = acquire_dtm1_source_objects(
              cache,
              catalog,
              selections,
              refresh=True,
              timeout=900,
          )
          t3 = time.perf_counter()
          cold_metadata = revalidate_dtm1_source_objects(cold_sources.values())
          t4 = time.perf_counter()

          source_rows = []
          for selection in selections:
              acquired = cold_sources[selection.href]
              source_rows.append({
                  'dataset_entry_id': selection.entry.id,
                  'dataset_entry_href': selection.href,
                  'dataset_entry_updated': selection.entry.updated,
                  'raw_sha256': acquired.raw_sha256,
                  'raw_byte_size': acquired.raw_byte_size,
                  'raster_metadata': acquired.raster_metadata,
              })

          plan_by_id = {plan.tile.tile_id: plan for plan in plans}

          def compile_set(sources_by_href, label, persist):
              rows = []
              for tile in tiles:
                  plan = plan_by_id[tile.tile_id]
                  source_objects = [sources_by_href[source.href] for source in plan.source_plan.sources]
                  coverage = validate_dtm1_source_set_covers_tile(
                      source_objects,
                      tile,
                      revalidated_metadata=(cold_metadata if label == 'cold' else warm_metadata),
                  )
                  started = time.perf_counter()
                  normalized = proof / f'{label}-{tile.tile_id}.tif'
                  normalized_meta, mosaic_metrics = warp_dtm_sources_to_canonical_grid(
                      [source.raw_path for source in source_objects],
                      normalized,
                      tile.bounds,
                  )
                  warped_at = time.perf_counter()
                  compiled = compile_terrain_artifact(source_objects, normalized, tile=tile)
                  compiled_at = time.perf_counter()
                  persisted = persist_terrain_artifact(compiled, normalized, cache) if persist else None
                  persisted_at = time.perf_counter()

                  with rasterio.open(normalized) as dataset:
                      values = dataset.read(1)
                      valid = values[values != dataset.nodata]
                      nodata_samples = int(values.size - valid.size)
                      if valid.size != values.size:
                          raise SystemExit(f'{tile.tile_id}: canonical terrain has {nodata_samples} nodata samples')
                      elevation = {
                          'valid_samples': int(valid.size),
                          'nodata_samples': nodata_samples,
                          'min_m': float(np.min(valid)),
                          'max_m': float(np.max(valid)),
                          'mean_m': float(np.mean(valid)),
                      }

                  artifact_file = None
                  bundle_file = None
                  if persisted is not None:
                      tile_dir = proof / 'artifacts' / tile.tile_id
                      tile_dir.mkdir(parents=True, exist_ok=True)
                      artifact_copy = tile_dir / Path(persisted.artifact_path).name
                      bundle_copy = tile_dir / Path(persisted.bundle_path).name
                      shutil.copyfile(persisted.artifact_path, artifact_copy)
                      shutil.copyfile(persisted.bundle_path, bundle_copy)
                      artifact_file = str(artifact_copy.relative_to(proof))
                      bundle_file = str(bundle_copy.relative_to(proof))

                  row = {
                      'tile_id': tile.tile_id,
                      'bounds_epsg25832': list(tile.bounds),
                      'center_epsg25832': list(tile.center),
                      'source_count': len(source_objects),
                      'source_hrefs': [source.retrieval_identity['dataset_entry_href'] for source in source_objects],
                      'source_raw_sha256': sorted(source.raw_sha256 for source in source_objects),
                      'coverage': coverage,
                      'mosaic': {
                          'required': plan.source_plan.mosaic_required,
                          'overlap_pixel_count': mosaic_metrics.overlap_pixel_count,
                          'max_overlap_delta_m': mosaic_metrics.max_overlap_delta_m,
                          'source_window_width': mosaic_metrics.source_window_width,
                          'source_window_height': mosaic_metrics.source_window_height,
                      },
                      'normalized_sha256': normalized_meta.sha256,
                      'normalized_byte_size': normalized_meta.byte_size,
                      'artifact_sha256': compiled.artifact_sha256,
                      'artifact_byte_size': len(compiled.artifact_bytes),
                      'lineage_hash': compiled.bundle['lineage_hash'],
                      'artifact_ref_hash': compiled.bundle['artifact_ref_hash'],
                      'source_snapshot_hashes': compiled.bundle['source_snapshot_hashes'],
                      'sample_count': compiled.sample_count,
                      'elevation': elevation,
                      'artifact_file': artifact_file,
                      'bundle_file': bundle_file,
                      'timings_ms': {
                          'normalize': round((warped_at - started) * 1000, 3),
                          'compile': round((compiled_at - warped_at) * 1000, 3),
                          'persist': round((persisted_at - compiled_at) * 1000, 3),
                          'total': round((persisted_at - started) * 1000, 3),
                      },
                  }
                  rows.append(row)
                  normalized.unlink()
              return rows

          cold_tiles = compile_set(cold_sources, 'cold', True)
          t5 = time.perf_counter()

          center = next(row for row in cold_tiles if row['tile_id'] == NANNESTAD_TILE.tile_id)
          if center['source_count'] != 1:
              raise SystemExit('historical center tile unexpectedly became a mosaic')
          if center['normalized_sha256'] != HISTORICAL_CENTER_NORMALIZED_SHA:
              raise SystemExit(
                  'center normalized hash regression: '
                  f"{center['normalized_sha256']} != {HISTORICAL_CENTER_NORMALIZED_SHA}"
              )
          if center['artifact_sha256'] != HISTORICAL_CENTER_ARTIFACT_SHA:
              raise SystemExit(
                  'center artifact hash regression: '
                  f"{center['artifact_sha256']} != {HISTORICAL_CENTER_ARTIFACT_SHA}"
              )

          warm_sources = acquire_dtm1_source_objects(
              cache,
              catalog,
              selections,
              offline=True,
              file_fetcher=lambda *_: (_ for _ in ()).throw(AssertionError('raw source network used during offline run')),
          )
          t6 = time.perf_counter()
          if not all(source.cache_hit for source in warm_sources.values()):
              raise SystemExit('offline source-object pool did not report all cache hits')
          warm_metadata = revalidate_dtm1_source_objects(warm_sources.values())
          t7 = time.perf_counter()
          warm_tiles = compile_set(warm_sources, 'warm', False)
          t8 = time.perf_counter()

          cold_by_id = {row['tile_id']: row for row in cold_tiles}
          warm_by_id = {row['tile_id']: row for row in warm_tiles}
          if set(cold_by_id) != set(warm_by_id):
              raise SystemExit('cold/offline tile ids differ')
          for tile_id, cold_row in cold_by_id.items():
              warm_row = warm_by_id[tile_id]
              for field in (
                  'source_raw_sha256',
                  'normalized_sha256',
                  'artifact_sha256',
                  'lineage_hash',
                  'artifact_ref_hash',
                  'source_snapshot_hashes',
              ):
                  if cold_row[field] != warm_row[field]:
                      raise SystemExit(f'{tile_id}: {field} changed cold->offline')

          if len({row['artifact_sha256'] for row in cold_tiles}) != 9:
              raise SystemExit('3x3 terrain artifacts do not have 9 unique byte identities')
          if len({row['lineage_hash'] for row in cold_tiles}) != 9:
              raise SystemExit('3x3 terrain artifacts do not have 9 unique lineage identities')
          if sum(1 for row in cold_tiles if row['mosaic']['required']) != 2:
              raise SystemExit('expected exactly two mosaic runtime tiles')
          if any(row['mosaic']['required'] and row['source_count'] != 2 for row in cold_tiles):
              raise SystemExit('mosaic tile did not bind exactly two source objects')

          result = {
              'schema': 'nwe.dtm1-multitile-realdata-proof/0.2',
              'status': 'PASS',
              'grid': {
                  'layout': '3x3',
                  'tile_count': 9,
                  'tile_size_m': 1000,
                  'horizontal_crs': 'EPSG:25832',
                  'vertical_datum': 'NN2000',
                  'center_tile_id': NANNESTAD_TILE.tile_id,
                  'mosaic_tile_count': 2,
              },
              'catalog': {
                  'service_feed_url': catalog.service_url,
                  'service_feed_sha256': catalog.service_sha256,
                  'dataset_feed_url': catalog.dataset_url,
                  'dataset_feed_sha256': catalog.dataset_sha256,
                  'dataset_entry_count': len(catalog.entries),
              },
              'sources': source_rows,
              'tiles': cold_tiles,
              'offline_repeat': {
                  'source_object_cache_hits': len(warm_sources),
                  'source_requests': 0,
                  'all_tile_hashes_equal': True,
              },
              'historical_center_compatibility': {
                  'normalized_sha256': center['normalized_sha256'],
                  'artifact_sha256': center['artifact_sha256'],
                  'matches_pr6': True,
              },
              'timings_ms': {
                  'catalog_fetch': round((t1 - t0) * 1000, 3),
                  'source_plan': round((t2 - t1) * 1000, 3),
                  'cold_two_source_acquire': round((t3 - t2) * 1000, 3),
                  'cold_source_revalidation': round((t4 - t3) * 1000, 3),
                  'cold_compile_persist_9_tiles': round((t5 - t4) * 1000, 3),
                  'offline_source_pool_load': round((t6 - t5) * 1000, 3),
                  'offline_source_revalidation': round((t7 - t6) * 1000, 3),
                  'offline_compile_9_tiles': round((t8 - t7) * 1000, 3),
              },
          }
          (proof / 'dtm1-multitile-proof.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'status': result['status'],
              'unique_sources': len(source_rows),
              'mosaic_tiles': sorted(mosaic_tile_ids),
              'sources': [
                  {
                      'href': row['dataset_entry_href'],
                      'sha256': row['raw_sha256'],
                      'bytes': row['raw_byte_size'],
                  }
                  for row in source_rows
              ],
              'center_compatibility': result['historical_center_compatibility'],
              'artifact_hashes': {row['tile_id']: row['artifact_sha256'] for row in cold_tiles},
              'mosaic_metrics': {
                  row['tile_id']: row['mosaic'] for row in cold_tiles if row['mosaic']['required']
              },
              'timings_ms': result['timings_ms'],
          }, indent=2))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install runtime canonicalization dependency
        run: npm install --workspace @nwe/schemas-js --include-workspace-root=false

      - name: Runtime-verify all 9 exact compiled artifacts and multi-source graph closure
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { verifyRuntimeBundle } from './engine/streaming/runtime_verifier.mjs';

          const proofDir = '/tmp/nwe-multitile-proof';
          const report = JSON.parse(fs.readFileSync(path.join(proofDir, 'dtm1-multitile-proof.json'), 'utf8'));
          const verifications = [];
          for (const tile of report.tiles) {
            const bundle = JSON.parse(fs.readFileSync(path.join(proofDir, tile.bundle_file), 'utf8'));
            const artifact = new Uint8Array(fs.readFileSync(path.join(proofDir, tile.artifact_file)));
            const verification = verifyRuntimeBundle(bundle, artifact);
            if (!verification.ok || verification.decision !== 'READY_FOR_RUNTIME') {
              throw new Error(`${tile.tile_id}: ${verification.code}: ${verification.detail}`);
            }
            if (bundle.compile_lineage.tile_id !== tile.tile_id || bundle.artifact_ref.tile_id !== tile.tile_id) {
              throw new Error(`${tile.tile_id}: runtime bundle tile identity mismatch`);
            }
            if (verification.reconstructed.source_snapshot_hashes.length !== tile.source_count) {
              throw new Error(`${tile.tile_id}: reconstructed source count mismatch`);
            }
            verifications.push({
              tile_id: tile.tile_id,
              source_count: tile.source_count,
              artifact_sha256: tile.artifact_sha256,
              verification,
            });
          }
          if (verifications.length !== 9) throw new Error(`expected 9 runtime verifications, got ${verifications.length}`);
          if (verifications.filter((item) => item.source_count === 2).length !== 2) {
            throw new Error('expected exactly two runtime-verified two-source mosaic tiles');
          }
          const result = {
            schema: 'nwe.dtm1-multitile-runtime-verification-proof/0.2',
            status: 'PASS',
            verified_tiles: verifications.length,
            verified_mosaic_tiles: verifications.filter((item) => item.source_count === 2).length,
            verifications,
          };
          fs.writeFileSync(path.join(proofDir, 'runtime-verification.json'), JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify({
            status: result.status,
            verified_tiles: result.verified_tiles,
            verified_mosaic_tiles: result.verified_mosaic_tiles,
          }, null, 2));
          NODE

      - name: Disk and proof inventory
        run: |
          df -h /tmp
          du -sh /tmp/nwe-multitile-data /tmp/nwe-multitile-proof
          find /tmp/nwe-multitile-proof -maxdepth 3 -type f -printf '%s %p\n' | sort -n

      - name: Attribution notice
        run: |
          cat > /tmp/nwe-multitile-proof/ATTRIBUTION.txt <<'EOF'
          Norge World Engine · Nannestad Prototype 0 DTM1 3x3 terrain proof

          DTM1 height data: Kartverket / Geonorge. CC BY 4.0.
          Runtime tiles are planned from the official Atom EPSG/GeoRSS metadata. Exact raw GeoTIFF
          objects are content-addressed and reused across runtime tiles; actual raster bounds are
          revalidated before normalization. Two southern runtime tiles require a two-source mosaic
          because the EPSG:25833 source grid and EPSG:25832 runtime grid cross at an angle.

          Full raw GeoTIFF source objects are intentionally never uploaded by this workflow.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: nannestad-dtm1-3x3-proof-${{ github.sha }}
          path: /tmp/nwe-multitile-proof
          if-no-files-found: error
          retention-days: 7
