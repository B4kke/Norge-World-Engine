name: dtm1-wcs-reference-inspect

on:
  pull_request:
    paths:
      - '.github/workflows/dtm1-wcs-reference-inspect.yml'
  workflow_dispatch:

jobs:
  inspect-wcs-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install compiler dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch and prove exact WCS QA grid
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          import rasterio

          WCS_BASE = 'https://wcs.geonorge.no/skwms1/wcs.hoyde-dtm-nhm-25832'
          EXPECTED_COVERAGE = 'nhm_dtm_topo_25832'
          BOUNDS = (611000.0, 6676000.0, 612000.0, 6677000.0)
          EXPECTED_TRANSFORM = (1.0, 0.0, 611000.0, 0.0, -1.0, 6677000.0)

          def fetch(url, accept):
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'NorgeWorldEngine/0.1 wcs-reference-inspect',
                  'Accept': accept,
              })
              with urllib.request.urlopen(request, timeout=120) as response:
                  if response.status != 200:
                      raise SystemExit(f'HTTP {response.status}: {url}')
                  return response.headers.get('Content-Type'), response.read()

          caps_url = WCS_BASE + '?' + urllib.parse.urlencode({
              'SERVICE': 'WCS', 'VERSION': '1.0.0', 'REQUEST': 'GetCapabilities',
          })
          caps_type, caps = fetch(caps_url, 'application/xml,text/xml;q=0.9,*/*;q=0.1')
          root = ET.fromstring(caps)
          names = []
          for element in root.iter():
              if element.tag.split('}')[-1] != 'CoverageOfferingBrief':
                  continue
              for child in list(element):
                  if child.tag.split('}')[-1] == 'name' and child.text and child.text.strip():
                      names.append(child.text.strip())
          names = sorted(set(names))
          if EXPECTED_COVERAGE not in names:
              raise SystemExit(f'missing expected coverage {EXPECTED_COVERAGE!r}: {names!r}')

          describe_url = WCS_BASE + '?' + urllib.parse.urlencode({
              'SERVICE': 'WCS', 'VERSION': '1.0.0', 'REQUEST': 'DescribeCoverage', 'COVERAGE': EXPECTED_COVERAGE,
          })
          describe_type, describe = fetch(describe_url, 'application/xml,text/xml;q=0.9,*/*;q=0.1')

          coverage_url = WCS_BASE + '?' + urllib.parse.urlencode({
              'SERVICE': 'WCS',
              'VERSION': '1.0.0',
              'REQUEST': 'GetCoverage',
              'COVERAGE': EXPECTED_COVERAGE,
              'CRS': 'EPSG:25832',
              'RESPONSE_CRS': 'EPSG:25832',
              'BBOX': ','.join(str(int(value)) for value in BOUNDS),
              'WIDTH': '1000',
              'HEIGHT': '1000',
              'FORMAT': 'GeoTIFF',
          })
          coverage_type, coverage = fetch(
              coverage_url,
              'image/tiff,application/geotiff,application/octet-stream;q=0.9,*/*;q=0.1',
          )
          if coverage[:4] not in (b'II*\x00', b'MM\x00*'):
              raise SystemExit('WCS GetCoverage response is not TIFF')

          path = Path('/tmp/wcs-reference.tif')
          path.write_bytes(coverage)
          with rasterio.open(path) as dataset:
              metadata = {
                  'crs': dataset.crs.to_string() if dataset.crs else None,
                  'bounds': list(dataset.bounds),
                  'width': dataset.width,
                  'height': dataset.height,
                  'count': dataset.count,
                  'dtype': dataset.dtypes[0],
                  'nodata': dataset.nodata,
                  'transform': list(dataset.transform)[:6],
                  'pixel_size': [abs(dataset.transform.a), abs(dataset.transform.e)],
              }
              if metadata['crs'] != 'EPSG:25832':
                  raise SystemExit(f'WCS CRS mismatch: {metadata["crs"]}')
              if metadata['bounds'] != list(BOUNDS):
                  raise SystemExit(f'WCS bounds mismatch: {metadata["bounds"]}')
              if metadata['width'] != 1000 or metadata['height'] != 1000 or metadata['count'] != 1:
                  raise SystemExit(f'WCS grid shape mismatch: {metadata}')
              if metadata['pixel_size'] != [1.0, 1.0]:
                  raise SystemExit(f'WCS pixel size mismatch: {metadata["pixel_size"]}')
              if tuple(metadata['transform']) != EXPECTED_TRANSFORM:
                  raise SystemExit(f'WCS transform mismatch: {metadata["transform"]}')

          proof = {
              'schema': 'nwe.dtm1-wcs-reference-inspection/0.1',
              'status': 'PASS',
              'role': 'independent_qa_sensor_not_promotion_source',
              'endpoint': WCS_BASE,
              'advertised_coverages': names,
              'selected_coverage': EXPECTED_COVERAGE,
              'requested_bounds_epsg25832': list(BOUNDS),
              'capabilities_sha256': hashlib.sha256(caps).hexdigest(),
              'describe_coverage_sha256': hashlib.sha256(describe).hexdigest(),
              'getcoverage_sha256': hashlib.sha256(coverage).hexdigest(),
              'getcoverage_byte_size': len(coverage),
              'content_types': {
                  'capabilities': caps_type,
                  'describe_coverage': describe_type,
                  'getcoverage': coverage_type,
              },
              'raster_metadata': metadata,
              'production_source_contract_note': 'nodata=None is acceptable only because this object is a diagnostic control surface and is never admitted to SourceSnapshot/promotion.',
          }
          Path('/tmp/wcs-reference-inspection.json').write_text(json.dumps(proof, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dtm1-wcs-reference-inspection-${{ github.sha }}
          path: /tmp/wcs-reference-inspection.json
          if-no-files-found: error
          retention-days: 7
