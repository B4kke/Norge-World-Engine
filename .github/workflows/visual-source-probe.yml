name: visual-source-probe

on:
  pull_request:
    paths:
      - 'tools/visual-data/**'
      - 'docs/data-licenses/visual-sources.md'
      - '.github/workflows/visual-source-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: |
          python -m py_compile tools/visual-data/probe_visual_sources.py
          python -m py_compile tools/visual-data/probe_visual_order_selections.py
          python -m py_compile tools/visual-data/probe_sr16_metadata_links.py
          python -m py_compile tools/visual-data/probe_vegetation_real_sample.py
          python -m py_compile tools/visual-data/probe_nibio_capabilities_catalog.py
          python -m py_compile tools/visual-data/probe_ar50_determinism.py

      - name: Probe current official source contracts
        run: |
          python tools/visual-data/probe_visual_sources.py --output /tmp/nwe-visual-source-probe.json >/dev/null
          python tools/visual-data/probe_visual_order_selections.py --output /tmp/nwe-visual-order-selection.json >/dev/null
          python tools/visual-data/probe_sr16_metadata_links.py --output /tmp/nwe-sr16-metadata-links.json >/dev/null
          python tools/visual-data/probe_vegetation_real_sample.py --output /tmp/nwe-vegetation-real-source-probe.json >/dev/null
          python tools/visual-data/probe_nibio_capabilities_catalog.py --output /tmp/nwe-nibio-capabilities-catalog.json >/dev/null
          python tools/visual-data/probe_ar50_determinism.py --output /tmp/nwe-ar50-determinism.json >/dev/null
          python - <<'PY'
          import json

          with open('/tmp/nwe-vegetation-real-source-probe.json', encoding='utf-8') as handle:
              report = json.load(handle)
          with open('/tmp/nwe-sr16-metadata-links.json', encoding='utf-8') as handle:
              metadata = json.load(handle)
          with open('/tmp/nwe-nibio-capabilities-catalog.json', encoding='utf-8') as handle:
              catalog = json.load(handle)
          with open('/tmp/nwe-ar50-determinism.json', encoding='utf-8') as handle:
              ar50_determinism = json.load(handle)

          def atom_summary(atom):
              return {
                  'atom_http': atom['http'],
                  'entry_count': atom['entry_count'],
                  'nannestad_entry_count': atom['nannestad_entry_count'],
                  'nannestad_data_link_count': atom['nannestad_data_link_count'],
                  'nannestad_data_links': atom['nannestad_data_links'],
                  'nannestad_snapshot': atom['nannestad_snapshot'],
                  'candidate_data_link_count': atom['candidate_data_link_count'],
              }

          def metadata_summary(key):
              item = metadata['datasets'][key]
              return {
                  'metadata_uuid': item['metadata_uuid'],
                  'license_access_fields': item['license_access_fields'],
                  'format_fields': item['format_fields'],
                  'temporal_fields': item['temporal_fields'],
                  'distribution_structures': item['distribution_structures'],
              }

          ar50_cap = report['ar50_capabilities']
          ar50 = report['ar50_sample']
          summary = {
              'status': report['status'],
              'tile': report['tile'],
              'sr16': {
                  'raster_atom': atom_summary(report['sr16_atoms']['raster']),
                  'vector_atom': atom_summary(report['sr16_atoms']['vector']),
                  'split_raster_metadata': metadata_summary('sr16_raster_split'),
                  'open_raster_legacy_candidate_metadata': metadata_summary('sr16_raster_open_legacy_candidate'),
                  'vector_metadata': metadata_summary('sr16_vector'),
                  'nibio_capability_endpoints': [
                      {
                          'requested_url': item.get('requested_url'),
                          'reachability': item.get('reachability'),
                          'http_status': item.get('http_status'),
                          'http': item.get('http'),
                          'top_level_keys': item.get('top_level_keys'),
                          'error': item.get('error'),
                      }
                      for item in catalog['probes']
                  ],
              },
              'ar50': {
                  'capabilities_http': ar50_cap['http'],
                  'wfs_version': ar50_cap['wfs_version'],
                  'feature_types': ar50_cap['feature_types'],
                  'sample_status': ar50['status'],
                  'sample_http': ar50['http'],
                  'feature_type': ar50['feature_type'],
                  'requested_crs': ar50['requested_crs'],
                  'requested_bounds': ar50['requested_bounds'],
                  'feature_member_count_capped': ar50['feature_member_count_capped'],
                  'property_names': ar50['property_names'],
                  'value_preview': ar50['value_preview'],
                  'determinism': {
                      'status': ar50_determinism['status'],
                      'raw_hash_changed': ar50_determinism['raw_hash_changed'],
                      'canonical_hash_a': ar50_determinism['canonical_hash_a'],
                      'canonical_hash_b': ar50_determinism['canonical_hash_b'],
                      'feature_count_a': ar50_determinism['feature_count_a'],
                      'feature_count_b': ar50_determinism['feature_count_b'],
                      'local_ids_identical': ar50_determinism['local_ids_identical'],
                      'volatile_fields_excluded': ar50_determinism['volatile_fields_excluded'],
                  },
              },
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: visual-source-probe-${{ github.sha }}
          path: |
            /tmp/nwe-visual-source-probe.json
            /tmp/nwe-visual-order-selection.json
            /tmp/nwe-sr16-metadata-links.json
            /tmp/nwe-vegetation-real-source-probe.json
            /tmp/nwe-nibio-capabilities-catalog.json
            /tmp/nwe-ar50-determinism.json
          if-no-files-found: error
          retention-days: 14
