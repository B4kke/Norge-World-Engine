name: visual-source-probe

on:
  pull_request:
    paths:
      - 'tools/visual-data/**'
      - 'docs/data-licenses/visual-sources.md'
      - '.github/workflows/visual-source-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax and suite regressions
        run: |
          python -m py_compile tools/visual-data/probe_visual_sources.py
          python -m py_compile tools/visual-data/probe_visual_order_selections.py
          python -m py_compile tools/visual-data/probe_sr16_metadata_links.py
          python -m py_compile tools/visual-data/probe_vegetation_real_sample.py
          python -m py_compile tools/visual-data/probe_nibio_capabilities_catalog.py
          python -m py_compile tools/visual-data/probe_ar50_determinism.py
          python -m py_compile tools/visual-data/materialize_vegetation_source_cache.py
          python -m py_compile tools/visual-data/normalize_vegetation_source_sample.py
          python -m py_compile tools/visual-data/verify_vegetation_source_sample.py
          python -m py_compile tools/visual-data/compile_vegetation_representative_sample.py
          python -m py_compile tools/visual-data/verify_vegetation_representative_sample.py
          python -m py_compile tools/visual-data/run_visual_source_probes.py
          python tools/visual-data/test_run_visual_source_probes.py
          python tools/visual-data/test_visual_source_active_dependency_classification.py

      - name: Probe current official source contracts with diagnostics
        id: source_probes
        continue-on-error: true
        run: |
          python tools/visual-data/run_visual_source_probes.py \
            --output-dir /tmp/nwe-visual-source-probes \
            --summary /tmp/nwe-visual-source-probe-suite.json

      - name: Upload visual-source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-source-probe-${{ github.sha }}
          path: |
            /tmp/nwe-visual-source-probe-suite.json
            /tmp/nwe-visual-source-probes/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce official source probe result
        if: steps.source_probes.outcome != 'success'
        run: |
          echo 'One or more active visual source contracts failed. Inspect the uploaded suite JSON for exact provider evidence. Research-candidate drift is reported inside probe JSON but does not invalidate accepted runtime sources.' >&2
          exit 1
