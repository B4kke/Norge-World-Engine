name: visual-source-probe

on:
  pull_request:
    paths:
      - 'tools/visual-data/**'
      - 'docs/data-licenses/visual-sources.md'
      - '.github/workflows/visual-source-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install normalization dependencies
        run: |
          python -m pip install --disable-pip-version-check -e engine/compiler
          if ! command -v ogrinfo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gdal-bin
          fi
          ogrinfo --version
          ogrinfo --formats | grep -i GML

      - name: Syntax check
        run: |
          python -m py_compile tools/visual-data/probe_visual_sources.py
          python -m py_compile tools/visual-data/probe_visual_order_selections.py
          python -m py_compile tools/visual-data/probe_sr16_metadata_links.py
          python -m py_compile tools/visual-data/probe_vegetation_real_sample.py
          python -m py_compile tools/visual-data/probe_nibio_capabilities_catalog.py
          python -m py_compile tools/visual-data/probe_ar50_determinism.py
          python -m py_compile tools/visual-data/materialize_vegetation_source_cache.py
          python -m py_compile tools/visual-data/normalize_vegetation_source_sample.py
          python -m py_compile tools/visual-data/verify_vegetation_source_sample.py

      - name: Probe current official source contracts
        run: |
          python tools/visual-data/probe_visual_sources.py --output /tmp/nwe-visual-source-probe.json >/dev/null
          python tools/visual-data/probe_visual_order_selections.py --output /tmp/nwe-visual-order-selection.json >/dev/null
          python tools/visual-data/probe_sr16_metadata_links.py --output /tmp/nwe-sr16-metadata-links.json >/dev/null
          python tools/visual-data/probe_vegetation_real_sample.py --output /tmp/nwe-vegetation-real-source-probe.json >/dev/null
          python tools/visual-data/probe_nibio_capabilities_catalog.py --output /tmp/nwe-nibio-capabilities-catalog.json >/dev/null
          python tools/visual-data/probe_ar50_determinism.py --output /tmp/nwe-ar50-determinism.json >/dev/null

      - name: Materialize bounded vegetation source cache
        run: |
          rm -rf /tmp/nwe-vegetation-cache /tmp/nwe-vegetation-normalize
          mkdir -p /tmp/nwe-vegetation-normalize
          python tools/visual-data/materialize_vegetation_source_cache.py \
            --work-dir /tmp/nwe-vegetation-cache \
            --output /tmp/nwe-vegetation-materialization.json

      - name: Normalize cached sources A1
        env:
          PROJ_NETWORK: 'OFF'
          GML_DOWNLOAD_SCHEMA: 'NO'
        run: |
          python tools/visual-data/normalize_vegetation_source_sample.py \
            --cache-root /tmp/nwe-vegetation-cache \
            --manifest /tmp/nwe-vegetation-materialization.json \
            --ar50-index 0 \
            --work-dir /tmp/nwe-vegetation-normalize/a1 \
            --output /tmp/nwe-vegetation-normalize/normalized-a1.json \
            --evidence /tmp/nwe-vegetation-normalize/evidence-a1.json

      - name: Normalize cached sources A2
        env:
          PROJ_NETWORK: 'OFF'
          GML_DOWNLOAD_SCHEMA: 'NO'
        run: |
          python tools/visual-data/normalize_vegetation_source_sample.py \
            --cache-root /tmp/nwe-vegetation-cache \
            --manifest /tmp/nwe-vegetation-materialization.json \
            --ar50-index 0 \
            --work-dir /tmp/nwe-vegetation-normalize/a2 \
            --output /tmp/nwe-vegetation-normalize/normalized-a2.json \
            --evidence /tmp/nwe-vegetation-normalize/evidence-a2.json

      - name: Normalize independent AR50 acquisition B
        env:
          PROJ_NETWORK: 'OFF'
          GML_DOWNLOAD_SCHEMA: 'NO'
        run: |
          python tools/visual-data/normalize_vegetation_source_sample.py \
            --cache-root /tmp/nwe-vegetation-cache \
            --manifest /tmp/nwe-vegetation-materialization.json \
            --ar50-index 1 \
            --work-dir /tmp/nwe-vegetation-normalize/b \
            --output /tmp/nwe-vegetation-normalize/normalized-b.json \
            --evidence /tmp/nwe-vegetation-normalize/evidence-b.json

      - name: Verify deterministic candidate sample
        run: |
          python tools/visual-data/verify_vegetation_source_sample.py \
            --materialization /tmp/nwe-vegetation-materialization.json \
            --evidence-a1 /tmp/nwe-vegetation-normalize/evidence-a1.json \
            --evidence-a2 /tmp/nwe-vegetation-normalize/evidence-a2.json \
            --evidence-b /tmp/nwe-vegetation-normalize/evidence-b.json \
            --normalized-a1 /tmp/nwe-vegetation-normalize/normalized-a1.json \
            --normalized-a2 /tmp/nwe-vegetation-normalize/normalized-a2.json \
            --output /tmp/nwe-vegetation-sample-evidence.json

      - uses: actions/upload-artifact@v4
        with:
          name: visual-source-probe-${{ github.sha }}
          path: |
            /tmp/nwe-visual-source-probe.json
            /tmp/nwe-visual-order-selection.json
            /tmp/nwe-sr16-metadata-links.json
            /tmp/nwe-vegetation-real-source-probe.json
            /tmp/nwe-nibio-capabilities-catalog.json
            /tmp/nwe-ar50-determinism.json
            /tmp/nwe-vegetation-materialization.json
            /tmp/nwe-vegetation-sample-evidence.json
            /tmp/nwe-vegetation-normalize/evidence-a1.json
            /tmp/nwe-vegetation-normalize/evidence-b.json
            /tmp/nwe-vegetation-normalize/normalized-a1.json
          if-no-files-found: error
          retention-days: 14
